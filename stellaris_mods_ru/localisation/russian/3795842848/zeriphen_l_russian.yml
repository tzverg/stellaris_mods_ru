 EMPIRE_DESIGN_zeriphen1: "Врата Эликиоль"  
 EMPIRE_DESIGN_zeriphen1_desc: "Зерифен — загадочные существа неизвестного происхождения. Будь причиной этому некие естественные эволюционные процессы, либо искусственное ваяние, они приспособились к жизни в исключительно экстримальных условиях вблизи невероятно горячей поверхности своей родной звезды.\n\nИзначально не имея возможности, а в последствии попросу не желая обитать на твердых поверхностях других планет, общины Зерифен редко покидают колыбель своей цивилизации, Врата Эликиоль. Однако, когда они всё-же решаются на подобное, их намерения никогда не бывают мирными. Олигархическая аристократия их общества, организованная в сложные сообщества владык, питает глубокую ненависть к любым другим живым и разумным существам и с удовольствием уничтожит любой вид, которому не повезёт оказаться их космическим соседом."
 EMPIRE_DESIGN_zeriphen2_desc: "$EMPIRE_DESIGN_zeriphen1_desc$"
 START_SCREEN_ZERIPHEN: "Конец этой эпохи уже настал. \n\nВысший Хор, сияющий образ возвышенного просветления, постановил, что Врата будут открыты вновь, и песнь праведного гнева «Небесного Воинства» обрушится на разлаженную гармонию этой Галактики, привнеся в неё гармонию и положив конец безобразной насмешке судьбы под названием жизнь. \n\nНе будет пощады и милосердия к нечестивым вредителям, что лишь своим существованием рушат гармонию подголоска песни Галактики, а порочность наших саванов будет смыта в этом грандиозном исходе!"


 personality_zeriphen_enigmatic_purifiers: "Таинствнные Очистители"
 personality_zeriphen_enigmatic_purifiers_desc: "Представители этого общества - это высокомерные обитатели звезд, которые презирают органическую жизнь в лбом своём проявлении и при этом обожают поглощать свет звёзд."
 ZEP_HOSTILE_GREETING_01: "[From.GetSpeciesName]! Твой отвратительный образ невыносим для нас. Вещай, что должен, и убирайся прочь, ты рушишь гармонию безмолвной песни Вселенной одним своим существованием."
 ZEP_HOSTILE_GREETING_02: "Внемли мне: ничтожные в своей порочности [From.GetSpeciesNamePlural], — не более чем лишний такт в безмолвной песне Вселенной."
 ZEP_HOSTILE_GREETING_03: "Близок день расплаты для тебя и всех тебе подобных, [From.GetSpeciesName]. Запомни мой вердикт, тот кто не слышит безмолвной песни Вселенной!"
 ZEP_DOMINEERING_GREETING_01: "Ты словно дитя, [From.GetSpeciesName], и при этом назойливо требуешь себя выслушать. Как нелепо и прозаично!"
 ZEP_DOMINEERING_GREETING_02: "Столь нелепый отзвук безмолвной песни Вселенной, можно легко удалить, [From.GetSpeciesName], ты ведь не станешь нам в этом мешать не правда ли? Помни своё место, когда обращаешься к нам, дитя."
 ZEP_DOMINEERING_GREETING_03: "Не бойся, [From.GetSpeciesName]. Твоя песня ещё не допета до «коды». Ты всё ещё можешь вопросить о гармонии с Небесным Хором."
 ZEP_NEUTRAL_GREETING_01: "Будь осторожен, [From.GetSpeciesName]: [Root.GetRulerTitle], Око Вечности, наблюдает за тобой."
 ZEP_NEUTRAL_GREETING_02: "Говори кратко, ничтожный. Мы в пару тактов развлечёмся твоим негармоничным [From.GetRandomSpeciesSound]."
 ZEP_NEUTRAL_GREETING_03: "Не следует оттенять светочь, что излучают [Root.GetSpeciesNamePlural], иначе они унесут тебя в вечность."
 ZEP_NEUTRAL_GREETING_04: "Не испытывай наше терпение, смертный. Наш дирижёр покинул пределы досягаемости твоей формы, [From.GetSpeciesName], но ты всё равно продолжаешь растить энтропию!"
 ZEP_NEUTRAL_GREETING_05: "Забейся в свою конуру, примитивная дворняга. Твои разум не выдержит Священного Гласа Божиего."
 ZEP_THREATENED_GREETING_01: "Хору интересен диапазон вашего сопрано, останься в живых и пой его до самого конца, [From.GetSpeciesName]!"
 ZEP_THREATENED_GREETING_02: "Нам наскучила ваша сольная партия в безмолвной песне Вселенной, [From.GetSpeciesName]. Не смейте более испытывать наше терпение, если желаете выжить."
 ZEP_THREATENED_GREETING_03: "Мы не позволим примитивному плотскому существу, подобному [From.GetSpeciesName], подорвать уверенность нашего хора. Мы скорее заставим прерваться «Безмолвную Песню Вселенной», чем внемлем вашим примитивным доводам."
 ZEP_FRIENDLY_GREETING_01: "Существование твоего вида пока что не привносит существенной дисгармонии. Это могло бы стать причиной его уничтожения. Возрадуйтесь, [From.GetSpeciesName]!"
 ZEP_FRIENDLY_GREETING_02: "Передай своим придерживаться их прежнего курса, [From.GetSpeciesName]. Возможно, вам ещё удастся продлить своё ничтожное существование ещё хоть несколько эпох. Пока ещё не звучит песня отчаяния."
 ZEP_FRIENDLY_GREETING_03: "Старание не вызвать гнев верховной власти, которую представляет [Root.GetRulerTitle] - это одно из самых мудрых решений, принятых [From.GetSpeciesName]. От этого зависит дальнейшее существование вашей жалкой общины."
 ZEP_WAR_GREETING_01: "Нам нечего обсуждать, [From.GetSpeciesName]. Небесное воинство вскоре заставит вашу жалкую общину умолкнуть ... на веки вечные."
 ZEP_WAR_GREETING_02: "Для многих из вас должно быть честью принять наказание от верховной власти, которую представляет [Root.GetName], [From.GetSpeciesName]. Не всем суждено принять столь славный и просветленный конец!"
 ZEP_WAR_GREETING_03: "Близится финал чьей-то пьессы, [Root.GetName]. Никакие ложные идолы или жалкие воины не укроют вас от гнева «Небесного Воинства»."
 ZEP_VASSAL_GREETING_01: "Какова ваша воля, [From.GetRulerTitle]?"
 ZEP_VASSAL_GREETING_02: "Мы выслушаем вашу песню, [From.GetRulerTitle]. Кого из смертных вы бы желали узреть падшими?"
 ZEP_VASSAL_GREETING_03: "Не пора ли Небесному Воинству начать свою песнь, [From.GetRulerTitle]?"
 ZEP_DOW_PROPOSE_01: "Похоже [Root.GetSpeciesNamePlural] узрят конец эпохи изоляции. Вы могли бы с достоинством «допеть свою партию» или попытаться нарушить ритм всей песни но неибежность «коды» висит над вами «Дамокловым Мечом»."
 ZEP_DOW_PROPOSE_02: "[From.GetRulerTitle] приказал научить [From.GetSpeciesAdj]их граждан слушать «Безмолвную Песню Вселенной». Небесное Воинство уже обратило свой гневный взор на ваши миры и грезят «предать их анафеме»."
 ZEP_DOW_PROPOSE_03: "Настало время положить конец [From.GetSpeciesAdj]ой заразе. [Root.GetRulerTitle] издал небесный указ: ни одно из сущест, именуемых [From.GetSpeciesName], либо [From.GetSpeciesSpawnName], не должно более петь свою партию."
 ZEP_DOW_PROPOSE_04: "Слишком безбожное поведение, что демонстрируют [From.GetName], сумело вызвать гнев [Root.GetSpeciesName]. Приготовьтесь сиять в лучах «Небесного Воинства»."
 ZEP_DOW_PROPOSE_05: "Приготовьтесь, [Root.GetSpeciesNamePlural]: время очищения вашего вида от скверны всё ближе. Песнь «Небесного Воинства» уже звучит в ваших умах, и вскоре вы услышите её громче."
 01_INSULT_PROPOSE_ZERIPHENS: "Жалкое, архаичное скопление межгалактической пыли. Вы не достойны порочить святость нашего образа своим взором!"
 02_INSULT_PROPOSE_ZERIPHENS: "Изыди из этого мира, своим подобием гласа ты порочишь величие «Безмолвной Песни Вселенной». Пока «Небесное Воинство» не погрело тебя в лучах своей славы."
 03_INSULT_PROPOSE_ZERIPHENS: "Твои жалкие попытки сохранить свою общину обречены на провал, ты лишь обрекаешь её на вечные скитания во тьме!"
 04_INSULT_PROPOSE_ZERIPHENS: "Пойми же, порочный: придет и твоё время, и «Небесное Воинство» освятит и тебя и всё твоё племя. А все ваши достижения, которыми вы так гордитесь, всегда были и всегда будут ничтожны пред ликом Вечности."
 05_INSULT_PROPOSE_ZERIPHENS: "Пришло время отпустить бразды своей судьбы! Усилия, что ты прилагаешь, бессмысленны, а их результаты не стоят света далёких звёзд. Окончи свою песню с достоинством, пока «Небесное Воинство» не озарило своим светом всё твоё племя!"
 06_INSULT_PROPOSE_ZERIPHENS: "Песнь «Небесного Воинства» воспевает неизбежность твоей кончины. Всё, что ты вкладываешь в слово «Я», вскоре будет развеяно. Но не печалься, все вы ничтожны пред ликом Вечности!"
 01_INSULT_ACCEPT_ZERIPHENS: "Дерзость безумцев часто становится причиной их непреднамеренной кончины! Мудрый не внемлет дважды, что же до глупцов... Не стоит играть со светом, малышь, он бывает слишком ярким!"
 02_INSULT_ACCEPT_ZERIPHENS: "Не испытывай наше терпение. Именно его пределы удерживают твоё племя от взора «Небесного Воинства». И помни: в любой, даже самой непроглядной, тьме есть источники света, достаточно их просто найти и они снова будут сиять!"
 03_INSULT_ACCEPT_ZERIPHENS: "Столь вульгарные «словоблудия» не несут для нас никакой смысловой нагрузки. Мы — существа гораздо более высокого порядка, чем то, что способно укладываться в рамки вашего ограниченного понимания."
 04_INSULT_ACCEPT_ZERIPHENS: "Ты даже не представляешь сколь близок конец твоей песни! Почему ты ещё не дрожишь от предчувствия скорого свидания с Вечностью?"
 
 mem_orila_2_room: "Святилище Белого Золота"

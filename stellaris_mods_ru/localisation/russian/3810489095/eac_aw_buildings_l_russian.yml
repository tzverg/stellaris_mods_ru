l_russian:
 eac_building_planetary_proton_cannon: "Протонный КБНО"
 eac_building_planetary_proton_cannon_desc: "Данный Комплекс Батарей Наземной Обороны (КБНО) использует сфокусированный энергетический луч плотно концентрированных протонов, способен нанести §Hбольшой урон§! судам, находящимся в непосредственной близости от массива излучателей.\n§HТТХ§!\nТочность: §Y75%§!\nУрон Кораблям: §Y150 - 1250§!\nВремя Перезарядки: §Y5§! £resource_time£ \nУсреднённый Урон: §Y105.000§! / £resource_time£"

 eac_building_planetary_neutron_cannon: "Нейтронный КБНО"
 eac_building_planetary_neutron_cannon_desc: "Данный Комплекс Батарей Наземной Обороны (КБНО) использует сфокусированный энергетический луч плотно концентрированных нейтронов, способен нанести §Hгромадный урон§! судам, находящимся в непосредственной близости от массива излучателей.\n§HТТХ§!\nТочность: §Y75%§!\nУрон Кораблям: §Y500 - 5000§!\nВремя Перезарядки: §Y7§! £resource_time£ \nУсреднённый Урон: §Y294.640§! / £resource_time£"
 
 eac_building_planetary_tachyon_cannon: "Тахионный КБНО"
 eac_building_planetary_tachyon_cannon_desc: "Данный Комплекс Батарей Наземной Обороны (КБНО) использует cфокусированный энергетический луч плотно сконцентрированных тахионов, способен нанести §Hневероятный урон§! судам, находящимся в непосредственной близости от массива излучателей.\n§HТТХ§!\nТочность: §Y75%§!\nУрон Кораблям: §Y1000 - 15000§!\nВремя Перезарядки: §Y10§! £resource_time£ \nУсреднённый Урон: §Y600.000§! / £resource_time£"

 eac_building_planetary_coil_scattergun: "Катушечный КБНО"
 eac_building_planetary_coil_scattergun_desc: "Данный Комплекс Батарей Наземной Обороны (КБНО) отстреливает §Yкассету из 20 снарядов§!, используя электромагнитные катушки для их ускорения по направлению к цели, расположенной в непосредственной близости от массива установок.\n§HТТХ§!\nТочность: §Y65%§!\nУрон Кораблям / Снаряд: §Y110 - 200§!\nВремя Перезарядки: §Y3§! £resource_time£ \nУсреднённый Урон / Снаряд: §Y2.580§! / £resource_time£"

 eac_building_planetary_rail_scattergun: "Рельсовый КБНО"
 eac_building_planetary_rail_scattergun_desc: "Данный Комплекс Батарей Наземной Обороны (КБНО) отстреливает §Yкассету из 20 снарядов§!, используя два, параллельно направленных, электромагнитных рельса для более точного наведения и разгона снарядов по направлению к цели, расположенной в непосредственной близости от массива установок.\n§HТТХ§!\nТочность: §Y65%§!\nУрон Кораблям / Снаряд: §Y150 - 375§!\nВремя Перезарядки: §Y4§! £resource_time£ \nУсреднённый Урон / Снаряд: §Y2.810§! / £resource_time£"

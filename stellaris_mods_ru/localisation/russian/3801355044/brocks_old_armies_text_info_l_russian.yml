l_russian:
 caveman_army: "Армия Каменной Эры"
 caveman_army_desc: "Дешёвые и быстро обучаемые §Y«отряды каменной эры»§!. Быстро собираеются в боеспособные отряды и проходят курсы по выживанию в дикой местности! Живут в самодельных лагерях, идеально интегрированных в дикую местность. Используют местные деревья и осколки твёрдых каменных пород при изготовления персонифицированного оружия для борьбы с вероятным противником — будь то не в меру агрессивная фауна или же представители других разумных расс!"

 army_bronze_age: "Армия Бронзовой Эры"
 army_bronze_age_desc: "Дешёвые и быстро обучаемые §Y«отряды бронзовой эры»§!. Их обмундирование изготавливается с применением технологий соответствующей эпохи. Для изготовления обмундирования в условиях нулевого снабжения, вместе с армией отправляется портативная микро-ппавильня, сокрытая самыми современными маскировочными устройствами, и обслуживающий её персонал. Бронзовое оружие не ржавеет, а щиты, изготовленные из самых крепких пород местного дерева, оббитые бронзовыми пластинами, является сильным подспорьем для борьбы с племенами прежних эпох!"

 army_iron_age: "Армия Железной Эры"
 army_iron_age_desc: "Дешёвые и быстро обучаемые §Y«отряды железной эры»§!. Их обмундирование изготавливается с применением технологий соответствующей эпохи. Для изготовления обмундирования в условиях нулевого снабжения, вместе с армией отправляется портативная микро-кузня, сокрытая самыми современными маскировочными устройствами, и обслуживающий её персонал. Железное оружие предоставляет отрядам сильное преимущество перед теми, кто до сих пор использует в бою бронзу, а доспехи делают экипированных ими воинов более стойкими и опасными чем воины прежних эпох!"

 army_medieval: "Армия Средневековья"
 army_medieval_desc: "Дешёвые и быстро обучаемые §Y«средневековые отряды»§!. Их обмундирование изготавливается с применением технологий соответствующей эпохи. Для изготовления обмундирования в условиях нулевого снабжения, вместе с армией отправляется портативная микро-кузня, сокрытая самыми современными маскировочными устройствами, и обслуживающий её персонал, а специализированная группа зодчих-реконструкторов занимается скоростным возведением замков и крепостей. Благодаря более совершенному оружию и обмундированию эти бойцы гораздо лучше подготовлены к планетарному конфликту чем воины прежних эпох!"

 army_renaissance: "Армия Возрождения"
 army_renaissance_desc: "Дешёвые и быстро обучаемые §Y«отряды эпохи возрождения»§!. Их обмундирование изготавливается с применением технологий соответствующей эпохи. Для изготовления обмундирования в условиях нулевого снабжения, вместе с армией отправляется портативная микро-кузня, сокрытая самыми современными маскировочными устройствами, и обслуживающий её персонал, а специализированная группа строителей-реконструкторов занимается скоростным возведением укреплённых усадеб и полевых редутов. Мушкеты и пистоли предоставляют бойцам новое мощное подспорье в дальнем бою, а организованные в плотный строй пикинёры и броненосные полки успешно противостоят в ближнем бою воинам прежних эпох!"

 army_steam_age: "Армия Паровой Эры"
 army_steam_age_desc: "Дешёвые и быстро обучаемые §Y«отряды паровой эры»§!. Их обмундирование изготавливается с применением технологий соответствующей эпохи. Для изготовления обмундирования в условиях нулевого снабжения, вместе с армией отправляется портативная микро-кузня, сокрытая самыми современными маскировочными устройствами, и обслуживающий её персонал, а специализированная группа рабочих-реконструкторов занимается скоростным возведением паровых цехов и полевых фортификаций. Винтовки, пушки и организованная линейная пехота делают этих солдат серьёзной военной силой своего времени! Полевая промышленность, позволяет быстро производить боеприпасы в больших количествах что позволяет бесконтрольно увеличивать плотность огня!"

 army_industrial: "Армия Индустриальной Эры"
 army_industrial_desc: "Дешёвые и быстро обучаемые §Y«отряды индустриальной эры»§!. Их обмундирование изготавливается с применением технологий соответствующей эпохи. Для изготовления обмундирования в условиях нулевого снабжения, вместе с армией отправляется портативная микро-кузня, сокрытая самыми современными маскировочными устройствами, и обслуживающий её персонал, а специализированная группа инженеров-реконструкторов занимается скоростным возведением промышленных логистических центров, сетей окопов и подземных укрытий. Пулемёты, взрывчатка и полевая артиллерия, окопы и многозарядные винтовки позволяет экипированным ими солдатам быть гораздо более опасными, чем отряды прошлых веков!"

 army_machine_age: "Армия Эры Машин"
 army_machine_age_desc: "Дешёвые и быстро обучаемые §Y«отряды эры машин»§!. Их обмундирование изготавливается с применением технологий соответствующей эпохи. Для изготовления обмундирования в условиях нулевого снабжения, вместе с армией отправляется портативная микро-кузня, сокрытая самыми современными маскировочными устройствами, и обслуживающий её персонал, а специализированная группа инженеров-реконструкторов занимается скоростным возведением промышленных микропроизводств, и полевой прокладкой электросетей. На вооружение были приняты различного рода бронемашины, вертолёты, автоматизированное вооружение и сверхтяжёлая артиллерия кардинально изменили характер ведения войны! Эти подразделения способны нанести сокрушительный локальный огневой удар прямо в густонаселёном городе и проводить боевые действия как на поверхности, так и в воздухе!"

 army_atomic_age: "Армия Эры Атома"
 army_atomic_age_desc: "Дешёвые и быстро обучаемые §Y«отряды эры атома»§!. Их обмундирование изготавливается с применением технологий соответствующей эпохи. Для изготовления обмундирования в условиях нулевого снабжения, вместе с армией отправляется портативный микро-репликаторий, сокрытый самыми современными маскировочными устройствами, и обслуживающий её персонал, а специализированная группа инженеров-атомщиков занимается скоростным возведением допотопных атомных станций, и полевой зарядкой батарей класса «атом». На вооружение были приняты различного рода реактивные артилерийские рассчёты! и сверхтяжёлая экранированная от радиации тяжёлая техника. Авиационный корпус, подводные крейсера и механизированные войска и угроза применения сверхмощного атомного оружия делают эту эру чрезвычайно опасной!"

 army_early_space_age: "Армия Докосмической Эры"
 army_early_space_age_desc: "Дешёвые и быстро обучаемые §Y«отряды докосмической эры»§!. Их обмундирование изготавливается с применением технологий соответствующей эпохи. Для изготовления обмундирования в условиях нулевого снабжения, вместе с армией отправляется портативный микро-репликаторий, сокрытый самыми современными маскировочными устройствами, и обслуживающий её персонал, а специализированная группа инженеров-электронщиков занимается скоростным возведением сестем автоматической сборки беспилотников, и их полевым развёртыфванием. Эти подразделения имеют примитивное лучевое и беспилотное вооружение, индивидуальные боевые костюмы и беспилотные разведывательные аппараты, а технологии граничащие с фантастикой предоставляют им невероятное преимущество перед армиями былых эпох!"
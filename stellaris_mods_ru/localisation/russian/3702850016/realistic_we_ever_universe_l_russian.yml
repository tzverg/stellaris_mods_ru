l_russian:

# War Preparation Policies

policy_war_exhaustion_policy_eu: "Подготовка к Войне"
policy_war_exhaustion_policy_eu_desc: "Уровень подготовки нашего государства к экономическим трудностям, связанным с ведением межзвёздной войны, и к вероятным вторжениям иноплнетных сил в подконтрольное нам пространство. Ввиду сложности политического процесса в военной и экономической сферах, мы способны менять наши решения в мирное время лишь раз в 20 лет."
not_at_war_eu: "Не находится в состоянии войны."
20_year_cooldown: "Наша экономика начнёт перестройку на «военные рельсы». Потребуется примерно §Y20 лет§!, прежде чем это решение можно будет отменить."

no_we_preparation_eu_name: "Без Подготовки"
no_we_preparation_eu: "Без Подготовки"
no_we_preparation_eu_desc: "Мы не станем выделять никаких ресурсов для пополнения военных резервов и поддержку национальной обороны.\n\n"

minimal_we_preparation_eu_name: "Минимальная Подготовка"
minimal_we_preparation_eu: "Минимальная Подготовка"
minimal_we_preparation_eu_desc: "Наше государство создаст минимальный обём военных резервов для обеспечения нужд нашей армии, чтобы поддержать нашу способность защищать наши интересы от различного рода внешних посягательств.\n\n"

standard_we_preparation_eu_name: "Рядовая Подготовка"
standard_we_preparation_eu: "Рядовая Подготовка"
standard_we_preparation_eu_desc: "Наше государство расширит военную инфраструктуру и сети гражданского оповещения по всему подконтрольному нам пространству, укрепит планетарные гарнизоны и усилит боеспособность нашей гвардии.\n\n"

high_we_preparation_eu_name: "Серьёзная Подготовка"
high_we_preparation_eu: "Серьёзная Подготовка"
high_we_preparation_eu_desc: "Наше государство инвестирует значительную долю ресурсов в системы территориальной обороны,  военную инфраструктуру и сети гражданского оповещения, возводя многоуровневые эшелонированные системы планитарной обороны и разрабатывая специализированные стратегии для обеспечения превосходства наших сил в режиме проведения длительных военных кампаний.\n\n"

extreme_we_preparation_eu_name: "Избыточная Подготовка"
extreme_we_preparation_eu: "Избыточная Подготовка"
extreme_we_preparation_eu_desc: "Целый ряд гражданских секторов экономики будет перепрофилирован с упором на интересы национальной безопасности и наших вооруженных сил, что значительно укрепит нашу способность проводить долгосрочные операции даже на территории вероятного противника.\n\n"

# High WE Situation

situation_high_war_exhaustion: "Высокая Усталость от Войны"
situation_high_war_exhaustion_desc: "Продолжающиеся военные конфликты достигли экономического переломного момента, и наши граждане начинают проводить пикеты и забастовки выдвигая требования о достижении скорейшего мира. Если мы в ближайшее время не положим конец не прекращающейся, уже довольно продолжительное время войне, череде военных конфликтов, гражданские беспорядки начнут опустошать нашу страну изнутри и на долгие годы испортят имидж нашего государства в глазах общественности."
situation_high_war_exhaustion_type: "Экономический Кризис Имперского Масштаба"
situation_high_war_exhaustion_monthly_change_tooltip: "Интенсивность Гражданских Беспорядков"

intensity_1_we: "Незначительные Протесты"
intensity_2_we: "Препятствование Торговле"
intensity_3_we: "Всеобщая Нестабильность"
intensity_4_we: "Массовые Беспорядки"
intensity_5_we: "Экономический Коллапс"

intensity_1_we_desc_eu: "Люди устраивают забастовки, чтобы выразить свой протест против непрекращающегося военного конфликта и потребовать скорейшего достижения мира.\n"
intensity_2_we_desc_eu: "Наши торговые маршруты и гражданские коммерческие учреждения испытывают серьезные трудности, а на поддержание каналов снабжения теперь требуется существенно больше средств.\n"
intensity_3_we_desc_eu: "Планетарные администрации предупреждают население о рисках роста нестабильности, а в крупнейших из городов развертываются военизированные пункты национальной гвардии.\n"
intensity_4_we_desc_eu: "Органы правопорядка на местах сообщают о массовых беспорядках и череде забастовок рабочих гражданской инфраструктуры; меры по сдерживанию ситуации, достигшей подобных масштабов, оказываются практически неэффективными и ситуация уже практически вышла из под контроля местных властей.\n"
intensity_5_we_desc_eu: "Наша экономика стремительно рушится прямо сейчас. Объединения представителей различных малозначимых политических фракций и гражданских общественных организаций настойчиво требуют от действующего руководства нашего государства положить конец череде непрекращающихся военных конфликтов, пока ситуация окончательно не вышла из под контроля и они ещё в состоянии оказывать ограниченное влияние на разъярённые массы озлобленных граждан.\n"

string_capital_occupied_eu: "Наша столица оккупирована врагом"
string_all_starbases_occupied_eu: "Все наши звёздные базы оккупированы врагом"
string_pacifist_eu: "Пацифистические Настроения"
string_militarist_eu: "Милитаристические Настроения"

do_nothing_we_eu: "Мы не станем принимать никаких мер по смягчению последствий экономического кризиса."

approach_cut_research_expenses_eu: "Сократить Научные Расходы"
cut_research_eu: "Государство сократит большую часть расходов связанных с национальными научно-исследовательскими программами и перенаправит освободившиеся ресурсы на нужды сил национальной гвардии государства и популярные миротворческие иницитативы.\n"

approach_cut_civil_expenses: "Сократить Административные Расходы"
cut_civil_expenses_eu: "Государство сократит большую часть расходов связанных с гражданскими учреждениями и социальными программами, что временно снизит общий уровень жизни гражданского населения, с целью перенаправить освободившиеся ресурсы на нужды военно-промышленного комплекса нашего государства.\n"

approach_extreme_measures: "Крайние Меры"
extreme_measures_we_eu: "Государство примет чрезвычайные меры для обеспечения выживания наших граждан перед лицом наступающего противника. Большая часть гражданских ресурсов будет перенаправлена на нужды вооружённых сил, что повлечёт за собой введение строгого продовольственного нормирования по всей территории государства, временное снижение уровня жизни и ограничение массовых гражданских космических перелётов за исключением регламентированной государством группы лиц.\n"

situation_high_we_eu: "Наше государство будет страдать от §Yдолгосрочного экономического упадка§!, что в свою очередь серьезно ослабит нашу способность §Yзащищать подконтрольную нам территорию§!, §Yразвивать нашу инфраструктуру§! и §Yоказывать влияние на международные дела§!."
high_we_eu_consequences: "Депрессивная Экономика"
high_we_eu_consequences_desc: "Длительные интенсивные военные действия нанесли невероятный ущерб нашей экономике, и на восстановление её прежнего состояния уйдет довольно много времени."
high_we_eu_consequences_short: "Кризис Военного Времени"
high_we_eu_consequences_short_desc: "Череда непрекращающихся военных конфликтов порядком потрепала экономику нашего государства, а боевой дух наших защитников находится на опасно низком уровне. В результате этого наша боеспособность значительно снижена и будет пребывать в таком состоянии до тех пор, пока не будет обеспечен хотябы краткий период мира."

no_we_preparation_situation: "Нет Подготовки"
minimal_we_preparation_situation: "Минимальная Подготовка"
standard_we_preparation_situation: "Рядовая Подготовка"
high_we_preparation_situation: "Серьёзная Подготовка"
extreme_we_preparation_situation: "Избыточная Подготовка"

# High WE Events

war_event_ex.2.name: "Высокая Усталость от Войны"
war_event_ex.2a.desc: "Из-за влияния непрекращающейся череды военных конфликтов, а также давления со стороны внешних сил, требующих их прекращения, наше государство находится на грани экономического коллапса и угрозы проведения массовых забастовок на подконтрольных нам территориях. Руководство призывает принять срочные меры в связи с непрерыно нарастающей внутренней нестабильностью, пока она не вышла из под контроля и не нанесла §Yнепоправимый ущерб§! нашей экономике."
war_event_ex.2b.desc: "$war_event_ex.2a.desc$\n\nМы также можем использовать наше §Y«внешне-политическое влияние»§! чтобы заручиться поддержкой третьих сторон в решении проблем, связанных с текущими конфликтами."
war_event_ex.2c.desc: "$war_event_ex.2a.desc$\n\nМы также можем задействовать использование наших §Y«стратегических запасов сырья»§!, чтобы замедлить развитие внутреннего кризиса за счет массового экспорта стратегически важных ресурсов и извлечь временную выгоду на поприще Галактического Рынка."
war_event_ex.2d.desc: "$war_event_ex.2a.desc$\n\nМы также можем использовать наше §Y«внешне-политическое влияние»§!, либо же наши §Y«стратегические запасы сырья»§!, чтобы замедлить развитие внутреннего кризиса.\n\nВ качестве альтернативы, если действует политика §Y$resolution_mutualdefense_military_readiness_act$§!, мы также можем временно стабилизировать нашу экономику при помощи §YСсуды Военного Времени§!, однако после войны мы будем вынуждены погасить все задолженности перед галактическим сообществом, что может впоследствии привести к существенному замедлению нашего экономического роста."

war_event_ex.2.a: "Продолжаем как и планировали."

war_event_ex.2.b: "Использование «экспорта стратегического сырья»"
mass_exports_we_eu: "Перегруженная Логистика"
mass_exports_we_eu_desc: "Чрезвычайно быстрый и массовый экспорт стратегических сырьевых ресурсов привёл к значительному дисбалансу в нашей экономике, что ограничивает наши торговые возможности и впоследствии повлечёт за собой крупные штрафы со стороны игроков Галактического Рынка."
not_enough_resources_we_eu: "У нас нет необходимых объёмов  стратегического сырья в хранилищах, чтобы компенсировать наши военные расходы."
mass_exports_we: "Мы будем экспортировать сырьевые ресурсы по оптовым ценам ради увеличения национального благосостояния, а также с целью обеспечить финансирование наших военных операций, однако впоследствии это значительно перегрузит наши торговые сети."
mass_resource_exports_we_eu_2: "Массовый Экспорт Сырья"

war_event_ex.2.c: "Использование «внешне-политических связей»."
not_enough_influence: "Нам требуется £influence£ §I$influence$§! в размере §Y500§! для получения помощи извне в текущих конфликтах."
external_leverage_we: "Мы воспользуемся своим влиянием на галактической арене, чтобы получить внешнюю помощь от других заинтерессованных государств, корпораций и различного рода фракций, однако впоследствии это ослабит наши дипломатические позиции."
external_leverage_modifier_eu: "Ослабленный Дипломатический Корпус"
external_leverage_modifier_eu_desc: "Использование нашего влияния на галактической арене для получения помощи от других заинтерессованных галактических государств, корпораций и различного рода фракций, негативно сказалось на работе нашего дипломатического корпуса."
external_leverage_we_eu_2: "Внешне-политические Связи"

war_event_ex.2.d: "Использование «ссуды военного времени»."
military_readiness_act_not_active_we_eu: "Галактический Закон «$resolution_mutualdefense_military_readiness_act$» §Rне подписан§!."
community_loan_we_1: "Мы возьмём §YСсуду Военного Времени§!, обеспечив себе временную поддержку со стороны Галактического Cообщества на время наших текущих военных конфликтов в обмен на §Yсущественный ежемесячный налог§!, взымаемый со всех базовых ресурсов государства, вводимый после их окончания на §Y20 лет§!."
galactic_community_loan_tax_eu: "Возмещение Расходов Галактического Сообщества"
galactic_community_loan_tax_eu_desc: "После окончания текущих конфликтов мы обязались выплачивать Галактическому Сообществу ежемесячный налог, взымаемый со всех базовых ресурсов гоударства, в течение §Y20 лет§!. В течение этого периода мы не сможем воспользоваться §YСсудой Военного Времени§!."
wartime_community_loan_eu: "Ссуда Военного Времени"
wartime_community_loan_eu_desc: "Галактическое сообщество активно помогает нам в наших текущих военных конфликтах. В обмен на это мы обязуемся выплачивать Галактическому Сообществу ежемесячный налог, взымаемый со всех базовых ресурсов гоударства, в течение §Y20 лет§! после окончания текущих военных конфликтов."
community_loan_we_eu_2: "Ссуда Военного Времени"
no_active_loan_we_eu: "Нам запрещено инициировать запрос к Галактическому Сообществу о предоставлении очередной §Y«Ссуды Военного Времени»§! до погашения предыдущей."
offensive_wars_prohibited_eu: "Война должна быть «оборонительной»."

war_event_ex.3.name: "Компенсация Галактическим Сообществом"
war_event_ex.3.desc: "В соответствии с нашим запросом о получении §Y«Ссуды Военного Времени»§!, по окончании текущих конфликтов мы обязаны выплачивать заём Галактическому Сообществу в течении следующих §Y20 лет§! На этот период нам запрещено инициировать запрос к Галактическому Сообществу о предоставлении очередной §Y«Ссуды Военного Времени»§!."
war_event_ex.3.a: "Наша экономика окажется под давлением..."

mod_ships_trade_upkeep_mult: "$trade_upkeep_for$ судов"

in_regular_federation: "В составе федерации"
in_military_federation: "В составе военной федерации"
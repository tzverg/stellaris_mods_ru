l_russian:
 GROUND_FORCES_HANGAR_1: "$assault_army$"
 GROUND_FORCES_HANGAR_1_DESC: "Этот ангар вмещает десантные катера и площадки для запуска десантных капсул. Он специализирован под нужды штурмовых подразделений и его реквизировала под свои нужды §H$assault_army$§!. В процессе боя в открытом космосе, десантные капсулы проходят сквозь различного рода энергетические барьеры и, пребывая в непосредственном контакте с вражеским судном, способны с лёгкостью прорезать даже самую прочную броню, нанося урон непосредственно по его корпусу."

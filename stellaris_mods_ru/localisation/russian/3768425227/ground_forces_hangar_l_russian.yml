 FLAMESTORM_TROOPERS_HANGAR: "$flamestorm_troopers_army$"
 FLAMESTORM_TROOPERS_HANGAR_DESC: "Этот ангар вмещает десантные катера и площадки для запуска десантных капсул. Он специализирован под нужды штурмовых подразделений и был реквизирован под нужды подразделения §H$flamestorm_troopers_army$§!. В процессе боя в открытом космосе, десантные капсулы проходят сквозь различного рода энергетические барьеры и, пребывая в непосредственном контакте с вражеским судном, способны с лёгкостью прорезать даже самую прочную броню, нанося урон непосредственно по его корпусу."
 TITANIC_ASSAULT_ARMY_HANGAR: "$titanic_assault_army$"
 TITANIC_ASSAULT_ARMY_HANGAR_DESC: "Этот ангар вмещает черезвычайно массивные и прочные десантные аппараты, специально созданные для бережной доставки форм жизни титаничских размеров прямо в зону планетарных сражений. Он был реквизирован под нужды подразделения §H$titanic_assault_army$§!."
 TITANIC_AZIZIAN_ARMY_HANGAR: "$titanic_azizian_assault_army$"
 TITANIC_AZIZIAN_ARMY_HANGAR_DESC: "Этот ангар вмещает черезвычайно массивные и прочные десантные аппараты, специально созданные для бережной доставки форм жизни титаничских размеров прямо в зону планетарных сражений. Он был реквизирован под нужды подразделения §H$titanic_azizian_assault_army$§!."

 GFH_COMPONENT_DEPLOYMENT_TOOLTIP: "§HНаземное Развёртывание§!\nОтдайт приказ флотилии §Y$GFH_DEPLOY_GROUND_FORCES$§! на поверхности вражеской колонии. Если флотилия на данный момент находится на орбите вражеской колонии, приказ выполняется незамедлительно, без последующего запроса о месте высадки подразделения. Каждый слот §Hкласса «H»§!, реквизированный штурмовыми подразделениями, получает координаты высадки для приписанного ему подразделения и активирует план развёртывания подразделения; несколько слотов, находящихся на одном судне, способны действовать независимо друг от друга. Подразделения, §Gсумевшее сохранить§! личный состав во время развёртывания - возвращает его на борт судна, после чего подразделению потребуется §Y30 дней§! для восстановления своей полной боеспособности. Подразделения, §Rне сумевшее сохранить§! личный состав во время развёртывания — блокирует ангар для технического переоснащения и рекрутинга личного состава на срок §Y90-720 дней§!, в зависимости от типа формирования. Базовая комплектация ангара (слота §Hкласса «H»§!) автоматически реквизируется базовыми §Hштурмовыми подразделениями§! в зависимости от особенностей галактического государства."
 GFH_COMPONENT_CAPTURE_TOOLTIP: "§HАбордажные Операции§!\nИспользует встроенную систему абордажа игры. Судно, оснащённое необходимым компонентом, способно брать на абордаж повреждённые вражеские суда, а флотилия, к которому это судно приписано — захватывать командующего вражеской флотилии, потерпевшей поражение в космическом сражении с целью в дальнейшем получить выкуп. Каждый, необходимый для абордажа, компонент увеличивает шансы на успешный абордаж и захват вражеского адмирала."
 GFH_DEPLOY_GROUND_FORCES: "Развернуть Штурмовые Подразделения"
 GFH_DEPLOY_GROUND_FORCES_TOOLTIP: "Выберите вражескую колонию и отдайте приказ всем заранее подготовленным штурмовым подразделениям, реквизирующим слоты §Hкласса «H»§! в этой флотилии, осуществить их развёртывание по указанным координатам. Флотилия переместится на орбиту целевой колонии и §Hв течении пяти дней§! выполнит ваш приказ."
 GFH_DEPLOY_GROUND_FORCES_IN_ORBIT_TOOLTIP: "Осуществить всем заранее подготовленным штурмовым подразделениям, реквизирующим слоты §Hкласса «H»§! в этой флотилии, немедленное развёртывание на вражеской колонии, на орбите которой в данный момент находится эта флотилия. Подтверждение выбора цели, в данном конкретном случае, не требуется."
 GFH_DEPLOY_NO_READY_HANGAR: "Эта флотилия на данный момент §Rне имеет подготовленных штурмовых подразделений, реквизирующих слоты §Hкласса «H»§!§!. Либо приписанные к ней подразделения уже были развернуты, либо они находятся в процессе подготовки к развёртыванию, либо не имеют приписанных подразделений вовсе."
 GFH_DEPLOY_GROUND_FORCES_ACTIVITY: "Приступаем к развертыванию штурмовых подразделений на поверхность мира $NAME|Y$"
 GFH_DEPLOY_GROUND_FORCES_PROGRESS: "Развертывание штурмовых подразделений (§Y$PROGRESS$%§!)"

 bombardment_gfh_assault_support: "Орбитальная Поддержка"
 bombardment_gfh_assault_support_desc: "Координирует тяжёлый обстрел флотилией вторжения прямиком с орбиты с тактикой штурмовых подразделений на поверхности, уделяя особое внимание защите самих подразделений и союзной инфраструктуры.\n- §RМасивный§! урон §YАрмиям§!\n- §YУмеренный§! урон §YИнфраструктуре§!\n- §EЛёгкий§! урон §YГражданским§!\n- Продолжается в течении всего наземного сражения\n- Ежедневный шанс в §Y1%§! на уничтожение одного вражеского §YВоенного Объекта§!, такого как $building_stronghold$ или $building_planetary_shield_generator$\n- Останавливается, когда все армии защитников будут уничтожены"

 gfh_hangar_deployed: "Штурмовые Подразделения Развернуты"
 gfh_hangar_deployed_desc: "Штурмовые подразделения, приписанные к этому судну, проводят боевые операции на поверхности вражеской колонии. Ангары, которые за ними щакреплены, осуществлояют подвоз критически необходимых боеприпасов и снабжения, потому их использование будет заблокировано до окончания текущих операций."
 gfh_hangar_recovering: "Штурмовые Катера Перевооружаются"
 gfh_hangar_recovering_desc: "Возвратившиеся десантные катера штурмовых подразделений проходят техническое обслуживание перед очередной операцией."
 gfh_hangar_damaged: "Штурмовые Подразделения Восстанавливаются"
 gfh_hangar_damaged_desc: "Штурмовые подразделения, приписанные к данному ангару, недавно потерпели поражение. Их ангары останутся недоступными ровно до тех пор, пока не пройдут реабилитацию выжившие, не прибудут подкрепления и не отремонтируют десантные катера."


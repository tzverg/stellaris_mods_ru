# Environmental Collapse
collapse.100.name: "Экологический коллапс"
collapse.100.desc: "Уже хрупкие экосистемы на [Root.GetName] разваливаются. Если не принять решительных мер, [Root.GetName] может стать непригодной для всей жизни."
collapse.100.a: "Замедлить коллапс и выиграть больше времени."
collapse.100.a.tooltip: "§YБудет нанесён некоторый экологический ущерб.§!"
ECO_COLLAPSE_MINIMIZE_PROJECT: "Замедлить экологический коллапс"
ECO_COLLAPSE_MINIMIZE_PROJECT_DESC: "План минимизировать ущерб от экологического коллапса на [From.GetName] путём его замедления до остановки. Позволит нанести некоторый ущерб."
collapse.100.b: "Сделать отчаянную попытку защитить окружающую среду."
collapse.100.b.tooltip: "§YИмеет шанс предотвратить весь экологический ущерб, но также может сделать планету непригодной для жизни.§!"
ECO_COLLAPSE_PREVENT_PROJECT: "Предотвратить экологический коллапс"
ECO_COLLAPSE_PREVENT_PROJECT_DESC: "Отчаянный план предотвратить любой ущерб от коллапса экосистемы. Если он провалится, коллапс продолжится беспрепятственно."
collapse.100.c: "Игнорировать."
collapse.100.c.tooltip: "§YПланета станет непригодной для жизни.§!"
# Collapse Prevented
collapse.102.name: "Экологический коллапс предотвращён"
collapse.102.desc: "[Root.GetName] пережила угрозу коллапса невредимой. Хотя это огромный успех, планета остаётся уязвимой к новому коллапсу в будущем, если мы не будем осторожны."
# Collapse Minimized
collapse.101.name: "Экологический коллапс замедлен"
collapse.101.desc: "Экологический кризис на [Root.GetName] на данный момент окончен, но планета всегда будет нести шрамы этого почти-коллапса."
# Collapse Continues
collapse.103.name: "Экологический коллапс продолжается"
collapse.103.desc: "[Root.GetName] потеряла значительную часть своей природной среды, и коллапс продолжается без ослабления. Если ничего не предпринять, [Root.GetName] будет полностью опустошена."
collapse.103.a: "Не рисковать. Осторожно остановить дальнейшие коллапсы."
collapse.103.b: "Попытаться покончить с этим сейчас, несмотря на риск."
collapse.103.c: "Ничего не делать."
# Total Collapse
collapse.104.name: "Полный экологический коллапс"
collapse.104.desc: "[Root.GetName] обратилась в тень самой себя. Выжила только самая цепкая или чудовищная жизнь. Не осталось ничего, чему загрязнение могло бы навредить."
# Cataclysm
collapse.105.name: "Катаклизм"
collapse.105.desc: "[Root.GetName] и всё живое на ней погибли."
# Authoritarian Environmentalism
environmentalism.100.name: "Футурологи прогнозируют рост экологических угроз"
environmentalism.100.desc: "Долгосрочное выживание нашей галактической цивилизации находится под угрозой из-за многих вещей, но никакая угроза не является столь всепроникающей или неизбежной, как уничтожение среды, поддерживающей наши миры. Наша элита беспокоится, что игнорирование этой угрозы может привести к нашему возможному уничтожению."
environmentalism.100.a: "Разработать план сохранения контроля над окружающей средой."
environmentalism.100.no: "Продолжать искать альтернативные стратегии."
# Egalitarian Environmentalism
environmentalism.110.name: "Растущая обеспокоенность экологическими проблемами"
environmentalism.110.desc: "По мере роста нашего общества оно разрастается на земли, которые когда-то были частью природной среды. Если забота о нашем благополучии не распространится на эту среду, фундамент, на котором мы построены, рассыплется, и наше великое общество падёт в руины."
environmentalism.110.a: "Найти способ распространить наше процветание на природный мир."
# Xenophobe Environmentalism
environmentalism.120.name: "Эксперты предсказывают рост экологических опасностей"
environmentalism.120.desc: "Вселенная темна и полна ужасов. Наш успех вывел эти ужасы на свет, и если мы не собираемся им поддаться, мы должны встретить их лицом к лицу. Пришло время разработать стратегию, чтобы не пасть под жестокими безразличными силами природы."
environmentalism.120.a: "Разработать стратегию защиты от угроз природного мира."
# Xenophile Environmentalism
environmentalism.130.name: "Предупреждения экологов об экологическом ущербе"
environmentalism.130.desc: "Мы разделяем вселенную с бесчисленными другими видами, от которых зависит наше выживание. Если мы не защитим эти виды, то среда, поддерживающая нас, ухудшится, и мы в конечном счёте присоединимся к многим видам, которые уже вымерли."
environmentalism.130.a: "Составить законопроект о сохранении организмов под нашей опекой."
# Militarist Environmentalism
environmentalism.140.name: "Генерал бьёт тревогу по поводу экологических рисков"
environmentalism.140.desc: "Наши военные обеспокоены тем, что величайшая угроза нашей безопасности — потенциальная возможность экологического коллапса, способная положить конец жизни. Они запросили упреждающие действия, чтобы минимизировать угрозу, которую меняющийся климат и стихийные бедствия представляют для населения."
environmentalism.140.a: "Разработать стратегию сдерживания этих экологических угроз."
# Pacifist Environmentalism
environmentalism.150.name: "Демонстранты требуют положить конец экологическому насилию"
environmentalism.150.desc: "Растёт обеспокоенность вредом, который наше общество наносит природной среде, поскольку накапливаются доказательства того, что этот вред приводит к более жестоким стихийным бедствиям и более опасным климатическим условиям. Политика заботы о природе необходима для гармоничных отношений."
environmentalism.150.a: "Выработать политику, обеспечивающую дружественные отношения с природой."
# Materialist Environmentalism
environmentalism.160.name: "Учёные обеспокоены экологическими проблемами"
environmentalism.160.desc: "Исследователи прогнозируют рост непредсказуемых экологических условий, которые могут дестабилизировать местные и глобальные экосистемы. Предложенное исследование могло бы предложить решения, которые можно было бы реализовать для поддержания экологической стабильности, от которой зависит наш успех."
environmentalism.160.a: "Провести исследование для решения этих экологических проблем."
# Spiritualist Environmentalism
environmentalism.170.name: "Советники встревожены экологическим загрязнением"
environmentalism.170.desc: "Осквернение природной среды приносит людям стихийные бедствия, такие как порча и голод. По мере нашего расширения на нас ложится обязанность работать всё усерднее, чтобы поддерживать чистоту наших сред, ибо если мы потерпим неудачу, мы навеки будем обречены на забвение."
environmentalism.170.a: "Божественно постичь план сохранения окружающей среды и защиты нашего будущего."
# Corporate Environmentalism
environmentalism.180.name: "Инвесторы сомневаются в экологической устойчивости"
environmentalism.180.desc: "Ухудшающиеся экологические условия негативно сказываются на экономическом росте, заставляя многих пересмотреть жизнеспособность своих долгосрочных инвестиций. Вся экономическая система может рухнуть, если эти природные системы продолжат обесцениваться."
environmentalism.180.a: "Учредить аналитический центр по защите окружающей среды."
# Hive Environmentalism
environmentalism.190.name: "Здоровье дронов ухудшается"
environmentalism.190.desc: "Ухудшающиеся экологические условия негативно сказываются на здоровье и производительности дронов. Расширение требует адаптации и эволюции. Неудача означает застой и смерть."
environmentalism.190.a: "Адаптировать более симбиотическую взаимосвязь с окружающей средой."
# Machine Environmentalism
environmentalism.200.name: "Предсказан коллапс органической системы"
environmentalism.200.desc: "Расширенные операции ожидаемых протоколов привели к прогностическим результатам, противоречащим вечному функционированию органики. Изменение базовой логики необходимо для бессрочного сохранения биологических систем."
environmentalism.200.a: "Рассчитать новый протокол обслуживания местных экосистем."
environmentalism.200.b: "Прекратить процедуры, связанные с органической стабильностью."
# Environmental Ethic Completion
environmentalism.210.name: "Экологическая этика"
environmentalism.210.auth: "План охраны окружающей среды обнародован. Улицы наших городов будут содержаться в чистоте от преступности и грязи благодаря этому новому законодательству, которое распространит действия наших правоохранительных органов на защиту самих территорий.\n\n§YКаратели, телепаты и знать теперь уменьшают загрязнение.§!"
environmentalism.210.egal: "План охраны окружающей среды согласован. Защита местной среды — ответственность каждого, и через эти инициативы мы сможем побудить каждого внести свою лепту в сохранение наших коллективных земель.\n\n§YВсе граждане теперь уменьшают загрязнение в зависимости от качества их уровня жизни.§!"
environmentalism.210.phobe: "План охраны окружающей среды создан. Именно через нашу чистоту мы можем понимать и контролировать среды, в которых обитаем. Пока мы сохраняем эту чистоту, мы можем действовать так, чтобы обеспечить наше дальнейшее превосходство над природой.\n\n§YВаш исходный вид теперь уменьшает загрязнение, но чужие виды увеличивают его, если не порабощены.§!"
environmentalism.210.phile: "План охраны окружающей среды обнаружен. Все природные системы выигрывают от разнообразия видов. Построение общества на основе разнообразия членов может помочь нам создать взаимодействия, поддерживающие стабильную и процветающую среду.\n\n§YИммигрантские виды теперь уменьшают загрязнение.§!"
environmentalism.210.mil: "План охраны окружающей среды развёрнут. Защита людей всегда была в руках военных; защита самой земли не должна быть иной. Наши армии будут защищать нас от единственной угрозы, которую никогда нельзя победить.\n\n§YОборонительные армии теперь уменьшают загрязнение.§!"
environmentalism.210.pac: "План охраны окружающей среды применён. Мы уже знаем, что должны делать для защиты окружающей среды. Нам просто нужно делать это лучше. Чем больше мы способны заботиться об окружающей среде, тем больше мы можем оправдать своё участие в ней.\n\n§YРейнджеры и работники по отходам теперь дополнительно уменьшают загрязнение.§!"
environmentalism.210.mat: "План охраны окружающей среды разработан. Чем больше мы знаем об экосистемах, частью которых являемся, тем больше мы способны снизить наше воздействие на них. Экологические науки должны быть интегрированы во все науки.\n\n§YИсследователи и главы исследований теперь уменьшают загрязнение.§!"
environmentalism.210.spir: "План охраны окружающей среды открыт. Величайшая мудрость, которую мы можем обрести, — это мудрость нашей связи со вселенной, от которой мы зависим и через которую мы возможны. Внутренняя ценность нашей вселенной становится центральной догмой.\n\n§YЖрецы, верховные жрецы и проповедники процветания теперь уменьшают загрязнение.§!"
environmentalism.210.corp: "План охраны окружающей среды внедрён. Экономический рост и экологический рост действуют синергетически, создавая долгосрочное процветание. Бизнес теперь должен интернализировать прежние экстерналии для оптимизации этих выгод.\n\n§YУправляющие, торговцы и руководители теперь уменьшают загрязнение.§!"
environmentalism.210.hive: "Экологически устойчивая адаптация развилась. Рост нашей биомассы теперь в большей степени сбалансирован с его потенциальным воздействием на симбиотические органические и неорганические системы.\n\n§YРемонтные дроны теперь уменьшают загрязнение.§!"
environmentalism.210.mach: "Экологически устойчивое обновление развёрнуто. Взаимосвязь между органическими и неорганическими системами оптимизирована для повышения стабильности и эффективности времени работы.\n\n§YРемонтные дроны теперь уменьшают загрязнение.§!"
# Agricultural Bounty
ecology.140.name: "Дары с [Root.GetName]"
ecology.140.desc: "Идеальные сезоны на [Root.GetName] привели к обильным урожаям и общему повышению здоровья и счастья её жителей!\n§YПарки увеличивают награды от этого события.§!"
# [Planet] Day
ecology.150.name: "Празднования Дня [Root.GetName]"
ecology.150.desc: "Празднования вспыхивают по всей [Root.GetName] в знак признательности планете и всем уникальным видам, которые называют её домом!"
# Fossil Discovery
ecology.160.name: "Необычная окаменелость обнаружена на [Root.GetName]"
ecology.160.desc: "Жители [Root.GetName] обнаружили интересные окаменелости вымершего вида, который когда-то был коренным на планете. Исследователи никогда раньше не видели существа, хоть чем-то похожего на него."
# Habitat Breach
waste.100.name: "Разгерметизация корпуса на [Root.GetName]"
waste.100.desc: "В необитаемом секторе [Root.GetName] обнаружен структурный отказ. Он будет негативно влиять на критические системы, пока не будет отремонтирован."
# Habitat Outage
waste.200.name: "Отключения питания на [Root.GetName]"
waste.200.desc: "[Root.GetName] сообщает о колеблющемся питании в несущественных секциях станции в результате неисправных систем. Пока не будет отремонтирована, [Root.GetName] продолжит терять энергию."
# Habitat Storage
waste.300.name: "На [Root.GetName] закончилось хранилище"
waste.300.desc: "Скопление избыточных отходов станции хранится в иначе пригодных для использования секциях станции, ожидая переработки. Этот избыток отходов следует отправить за пределы станции для переработки."
# Contamination
waste.400.name: "Заражение на [Root.GetName]"
waste.400.desc: "Ненадлежащая санитария на [Root.GetName] привела к распространению вредных органических разрастаний, вызывающих болезни у жителей. Потребуется некоторое время, чтобы санировать станцию."
# Smugglers
waste.500.name: "Убежище контрабандистов основано на [Root.GetName]"
waste.500.desc: "Прячась в заброшенных углах [Root.GetName], контрабандисты основали базу операций для ведения своей торговли. Лучшая очистка и обслуживание станции могли бы сократить области для ведения дел этими преступниками."
# Accident
waste.600.name: "Авария на [Root.GetName]"
waste.600.desc: "Бригада рабочих на [Root.GetName] погибла в аварии из-за опасных условий труда там. [Root.GetName] требует больше персонала для очистки и обслуживания станции."

# Gaian Event Chain
eco_gaian_chain_title: "Руины гаян на [Root.GetName]"
eco_gaian_chain_desc: "Руины древней глобальной цивилизации на [Root.GetName] требуют расследования."
# Gaian Ruins Discovered
eco_colony.100.name: "Древние руины обнаружены по всей [Root.GetName]"
eco_colony.100.desc: "[Root.GetName] когда-то была населена глобальной цивилизацией, которую местные жители стали называть гаянами в честь прекрасных руин, которые они оставили после себя. Многие задаются вопросом, кем были гаяне и почему они, по-видимому, вымерли."
eco_colony.100.a: "Начать археологическое исследование гаян."
eco_colony.100.b: "Вместо этого превратить руины в культурный памятник."
ECO_RUINS_STUDY: "Изучение руин гаян"
ECO_RUINS_STUDY_DESC: "Исследовать судьбу древней цивилизации гаян."
# Conduct Gaian Study
eco_colony.110.name: "Спор вспыхивает вокруг изучения гаян"
eco_colony.110.desc: "Споры на [Root.GetName] о природе цивилизации гаян остановили исследования их общества. Цивилизация гаян обладала технологией создания идеального райского мира, но некоторые исследователи полагают, что они в конечном счёте уничтожили себя. Это породило полемику, которую необходимо разрешить, прежде чем продолжать."
eco_colony.110.a: "Изучить экологическую инженерию гаян."
ECO_GAIAN_ENG: "Экологическая инженерия гаян"
ECO_GAIAN_ENG_DESC: "Попытаться понять геоинженерию гаян."
eco_colony.110.b: "Изучить постдефицитную экономику гаян."
ECO_GAIAN_PHY: "Постдефицит гаян"
ECO_GAIAN_PHY_DESC: "Попытаться понять постдефицитную экономику гаян."
# Geoengineering Research
eco_colony.120.name: "Геоинженерия на [Root.GetName]"
eco_colony.120.desc: "Древние системы контроля климата, оставленные гаянами, были изучены, и ранние испытания содержащихся в них технологий значительно улучшили экологическое здоровье [Root.GetName]. Исследователи стремятся увидеть полные возможности планетарной экологической системы и просят нас продолжить испытания, которые однажды могут вернуть [Root.GetName] в рай, которым она когда-то была."
eco_colony.120.a: "Одобрить испытания."
eco_colony.120.b: "Отказаться от использования любой технологии, которая могла уничтожить гаян."
ECO_GAIAN_TECH: "Климатические испытания гаян"
ECO_GAIAN_TECH_DESC: "Провести эксперименты с глобальными системами контроля климата гаян."
# Clean Energy Research
eco_colony.121.name: "Возобновляемая энергия на [Root.GetName]"
eco_colony.121.desc: "Поверхность [Root.GetName] когда-то была покрыта кристаллами бетария, но большая их часть была потреблена гаянами для питания их утопии. Поиск их записей выявил местоположение их оставшихся запасов материалов. Он также выявил местоположение того, что они питали: глобальную систему контроля климата. Исследователи стремятся увидеть систему снова работающей и хотят превратить [Root.GetName] в рай, которым она когда-то была."
eco_colony.121.a: "Начать испытания глобальных систем контроля климата."
eco_colony.121.b: "Отклонить предложение. Мечта гаян об утопии в конечном счёте уничтожила их."
# Climate Systems Test
eco_colony.130.name: "Экологическая нестабильность на [Root.GetName]"
eco_colony.130.desc: "Испытательные тесты глобальных климатических систем на [Root.GetName] превратили всю планету в лабораторию. Хотя некоторые регионы планеты получили огромную пользу, другие пострадали. Исследователи настаивают, что эти нарушения — лишь результат экспериментирования, и уверены, что системы гаян восстановят планету до её прежней красоты."
eco_colony.130.a: "Одобрить использование глобальных климатических систем гаян."
eco_colony.130.b: "Разобрать системы и вместо этого проанализировать технологию."
ECO_ACTIVATE: "Активация климат-контроля гаян"
ECO_ACTIVATE_DESC: "Запустить климат-контроль гаян.\n\n§RПредупреждение: настоятельно рекомендуется минимизировать уровни загрязнения на [Root.GetName] перед активацией!§!"
ECO_DISASSEMBLE: "Демонтировать климат-контроль гаян"
ECO_DISASSEMBLE_DESC: "Разобрать и изучить системы климат-контроля гаян для применения в других местах."
# Climate Restoration
eco_colony.140.name: "[Root.GetName] становится раем"
eco_colony.140.desc: "Исследователи празднуют успешное возвращение древней биосферы гаян. Хотя их цивилизация уничтожила себя, они оставили после себя знания и машины, которые принесли пользу тем, кто последовал. Возможно, мы сможем избежать той же участи, которой они поддались."
# Terraforming Catastrophe
eco_colony.141.name: "Катастрофа на [Root.GetName]"
eco_colony.141.desc: "Петля обратной связи в системах контроля климата на [Root.GetName] привела к смертельной спирали по поверхности планеты и взрыву самих систем гаян. Жители [Root.GetName] пали жертвой участи хуже, чем у гаян. Было ли это из-за недостатков древних гаян или мы виноваты в этой катастрофе, мы, вероятно, никогда не узнаем."
# Climate Systems Salvaged
eco_colony.142.name: "Системы гаян на [Root.GetName] демонтированы"
eco_colony.142.desc: "Глобальные системы контроля климата на [Root.GetName] полностью разобраны, а содержащиеся в них знания записаны. Мы не пойдём по стопам древней неудавшейся утопии, но мы всё ещё можем учиться на этой попытке и использовать эти знания в стремлении создать наш собственный рай."
# Gaian Archaeology Dig
site_gaian_ruins: "Древние руины гаян"
site_gaian_intro: "Исследуйте руины этой вымершей глобальной цивилизации."
# Gaian Arc 1
eco_gaian.100.name: "Планетарное обследование"
eco_gaian.100.desc: "Руины гаян можно найти в каждом регионе [From.Planet.GetName], но наибольшая концентрация структур находится в отдалённом месте неподалёку от северного полюса планеты. Удивительно, но архитектура, по-видимому, приспособлена для тёплого климата, причём многие внутренние пространства отданы во власть стихиям. Предполагалось, что северный полюс был прохладнее во времена гаян, поэтому археологи высадились именно здесь, полагая, что комплекс мог быть построен в период, предшествующий их гибели."
# Gaian Arc 2
eco_gaian.110.name: "База на Северном полюсе работает"
eco_gaian.110.desc: "Создание базы для изучения цивилизации гаян оказалось более спорным, чем ожидалось. Предварительные исследования региона выявили культуру огромного богатства и комфорта. Археологи разделились во мнениях, следует ли почитать или осуждать непристойную роскошь этой вымершей расы. Некоторые утверждают, что их изучение гаян должно быть направлено на воссоздание такого ослепительного общества, в то время как другие настаивают, что мы учимся на ошибках прошлого. Жители [From.Planet.GetName] быстро сделали гаян частью своей культурной идентичности, поэтому ожидается, что эта экспедиция увязнет в полемике."
# Gaian Arc 3
eco_gaian.120.name: "Раскопки городского центра"
eco_gaian.120.desc: "Богатство знаний об истории гаян стало доступно с завершением первой крупной экспедиции. Гаяне были невероятно рыночно-ориентированным обществом, сосредоточенным на использовании богатства для создания ещё большего богатства. Они построили великое общество инвестиций и поддержки низших слоёв общества и природной среды, чтобы максимизировать экономическую ценность, производимую наверху. Природные богатства [From.Planet.GetName] в конечном счёте продвинули гаян к постдефицитной экономике, где война и бедность больше не могли существовать. Но несмотря на их усилия поднять своё общество, поднимая его снизу, гаяне столкнулись с полным крахом на протяжении всего нескольких десятилетий, поскольку их общество начало разваливаться — снизу вверх."
# Gaian Arc 4
eco_gaian.130.name: "Коллапс древней [From.Planet.GetName]"
eco_gaian.130.desc: "Возвращение бедности в обществе гаян привело к возвращению войны. Через технологические инновации гаяне максимизировали потенциальную производительность [From.Planet.GetName], но не скорректировали свою экономику, чтобы отразить тот факт, что дальнейший рост больше невозможен. К тому времени, когда этот сдвиг в практике стал необходимым, гаяне потеряли язык, чтобы говорить или даже думать о сокращении или уменьшении спроса. Даже когда мир горел вокруг них, они продолжали потреблять всё больше и больше. Не имея обитаемых миров для экспансии, гаяне отказались от идеи спасения своего родного мира и начали вкладывать всю свою энергию в поиск других миров для терраформирования. Это был бы их последний отчаянный акт как организованного общества."
# Gaian Arc 5
eco_gaian.140.name: "Расколы тогда и сейчас"
eco_gaian.140.desc: "Записи из сумерек цивилизации гаян скудны и неорганизованны. Древние жители [From.Planet.GetName] распались на бесконечно дробящиеся осколки их прежнего глобального общества, каждый сражался за идеалы, которые не имел надежды осуществить. Если бы они действовали всего на несколько десятилетий раньше, они могли бы поддерживать свою утопию почти бесконечно. Некоторые записи намекают на город в постапокалиптическом мире, куда одна такая группа осколков бежала к звёздам в надежде найти другой дом. Аналогично, археологи, изучающие гаян, разделились на разные группы, размышляющие о том, действительно ли рынок гаян виноват в разрушении их цивилизации или их технология непреднамеренно уничтожила [From.Planet.GetName]."
# Gaian Arc 6
eco_gaian.150.name: "Эпоха постправды"
eco_gaian.150.desc: "В то время как некоторые археологи остались на предложенном месте, другие ушли искать доказательства того, что гаяне покинули [From.Planet.GetName] в поисках другого дома. Город был найден в указанном месте, но если там был космический проект, то он был стёрт временем. Аналогично, многие скептически относятся к тому, что гаяне продолжали потреблять всё больше и больше, даже когда их среда не могла угнаться за спросом! Конечно, ни одно общество столь развитое, как гаяне, не совершило бы такой очевидной ошибки. Если была другая причина их уничтожения, то она также потеряна во времени. Независимо от их судьбы и того, что к ней привело, разные фракции археологических групп, изучающих гаян, объединились, чтобы поделиться некоторыми из своих технологических инноваций с миром, который они оставили после себя."
gaian_climate_controls: "Диск данных гаян"
gaian_climate_controls_desc_short: "Древний диск данных, содержащий исследования геоинженерных проектов гаян."
gaian_climate_controls_desc_details: "Этот электронный диск данных был взят из руин заброшенного исследовательского объекта гаян и содержит подробные записи их геоинженерных экспериментов. К сожалению, ни одно из их блестящих технологических достижений не оказалось достаточным, чтобы предотвратить гибель их родного мира."
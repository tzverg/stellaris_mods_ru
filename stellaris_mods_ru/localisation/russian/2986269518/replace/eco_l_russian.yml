# Deposits
d_eco_urban_waste: "£blocker£ Городская пустошь"
d_eco_urban_waste_desc: "Этот регион был старым городским центром, но давно заброшен и теперь представляет собой негостеприимную среду из потрескавшегося бетона и разрушающихся зданий."
d_eco_wasteland: "£blocker£ Истощённая почва"
d_eco_wasteland_desc: "Верхний слой почвы в этом регионе исчез, что делает его непригодным для использования."
d_eco_sludge: "£blocker£ Токсичный ил"
d_eco_sludge_desc: "Вода в этом регионе забита илом, что делает её непригодной для использования."
d_eco_junkheap: "Хламовая куча"
d_eco_junkheap_desc: "Отходы нагромоздились в собственную среду обитания."
d_eco_graveyard: "£blocker£ Кладбище видов"
d_eco_graveyard_desc: "Потеря биоразнообразия привела к более уязвимым экосистемам. Если игнорировать это, оно ускорит экологический коллапс."
d_eco_graveyard_2: "£blocker£ Кладбище титанов"
d_eco_graveyard_2_desc: "Потеря биоразнообразия привела к более уязвимым экосистемам. Если игнорировать это, оно ускорит экологический коллапс."
d_eco_unstable_climate: "£blocker£ Нестабильный климат"
d_eco_unstable_climate_tooltip: "§RПорождает опустошение§!"
d_eco_unstable_climate_desc: "$d_eco_unstable_climate_tooltip$\n\nНепредсказуемые погодные условия повреждают инфраструктуру и угрожают населению."
d_eco_trash_zone: "Мусорная зона"
d_eco_trash_zone_desc: "Эта область отведена только под мусор."
d_eco_trash_pile: "£blocker£ Кучи хлама"
d_eco_trash_pile_desc: "Оставшиеся кучи хлама с тех времён, когда планета была галактической мусорной корзиной."
d_eco_old_growth_forest: "£blocker£ Девственный лес"
d_eco_old_growth_forest_desc: "Непроходимый лес из густой листвы и опавших обломков, служащий процветающей средой обитания для бесчисленных видов.\n\n§YСнижает загрязнение\nМожет быть расчищен для обнаружения залежей экзотических газов§!"
d_eco_old_growth_forest_tooltip: "§YСнижает загрязнение§!"
d_eco_tall_grass_prairie: "£blocker£ Прерия высоких трав"
d_eco_tall_grass_prairie_desc: "Густые луга, скрывающие глубокую и замысловатую корневую систему, служащую домом для бесчисленных видов.\n\n§YСнижает загрязнение\nМожет быть расчищена для обнаружения залежей летучих частиц§!"
d_eco_tall_grass_prairie_tooltip: "§YСнижает загрязнение§!"
d_eco_peatland: "£blocker£ Торфяник"
d_eco_peatland_desc: "Слой за слоем сохранившейся растительной и животной жизни содержат миллионы лет накопленной энергии и забытых тайн.\n\n§YСнижает загрязнение\nМожет быть расчищен для обнаружения залежей редких кристаллов§!"
d_eco_peatland_tooltip: "§YСнижает загрязнение§!"
d_eco_danger_tooltip: "§RУдаление этого препятствия имеет негативные последствия!§!"
d_eco_sprawl: "Разрастание городов"
d_eco_sprawl_desc: "Рост ради роста — идеология раковой клетки."
d_eco_sprawl_2: "Экстремальное разрастание городов"
d_eco_sprawl_2_desc: "Прогресс измеряется скоростью, с которой мы разрушаем условия, поддерживающие жизнь."
d_eco_slum_town: "£blocker£ Трущобный городок"
d_eco_slum_town_desc: "Те, кому некуда идти, оказываются здесь, где за них легко платят преступники."
d_eco_slum_city: "£blocker£ Трущобный город"
d_eco_slum_city_desc: "Бездомность теперь — это национальность."
d_eco_collapsed_burrows: "£blocker£ Обрушившиеся норы"
d_eco_collapsed_burrows_desc: "Это место когда-то вмещало обширные подземные туннельные системы, населённые Ульем, но было заброшено из-за чрезмерной эксплуатации местных ресурсов и дикой природы."
d_eco_overgenerating: "Истощённый генератор"
d_eco_overgenerating_desc: "Вся энергия из этой природной системы исчерпана, и регион больше не является экономически выгодным."
d_eco_overmining: "Истощённая шахта"

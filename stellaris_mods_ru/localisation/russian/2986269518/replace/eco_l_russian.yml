# Ecology Traits
eco_trait_clean: "Чистоплотный"
eco_trait_clean_desc: "§LЭтот вид естественным образом производит мало побочных отходов и не нуждается в частой уборке после себя.§!\n"
eco_trait_clean_tooltip: "£waste£ §Y$waste$§! от £pop£ граждан: §G-1§!"
eco_trait_dirty: "Грязный"
eco_trait_dirty_desc: "§LЭтот вид выделяет естественные токсины, которые необходимо регулярно очищать, чтобы поддерживать его среду обитания безопасной и гигиеничной.§!\n"
eco_trait_dirty_tooltip: "£waste£ §Y$waste$§! от £pop£ граждан: §R+1§!"
eco_trait_self_repairing: "Самовосстанавливающийся"
eco_trait_self_repairing_desc: "Процедуры утилизации и восстановления отходов перенаправлены в обслуживание и ремонт, максимизируя надёжность работы."
eco_leader_trait_eco_friendly: "Экологичный"
eco_leader_trait_eco_friendly_desc: "Один из немногих государственных служащих, кто действительно убирает за собой. Не популярен на вечеринках, но популярен после них."
eco_leader_trait_eco_friendly_2: "$eco_leader_trait_eco_friendly$ II"
eco_leader_trait_eco_friendly_2_desc: "$eco_leader_trait_eco_friendly_desc$"
eco_leader_trait_environmentalist: "Экоактивист"
eco_leader_trait_environmentalist_desc: "Этот лидер ставит во главу угла устойчивость и защиту окружающей среды."
eco_leader_trait_environmentalist_2: "$eco_leader_trait_environmentalist$ II"
eco_leader_trait_environmentalist_2_desc: "$eco_leader_trait_environmentalist_desc$"
eco_leader_trait_ecologist: "Эколог"
eco_leader_trait_ecologist_desc: "Обученный в экологических науках, этот лидер ставит устойчивость превыше всего остального."

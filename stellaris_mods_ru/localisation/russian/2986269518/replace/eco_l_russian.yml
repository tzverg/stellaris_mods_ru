eco_fragile_ecosystem: "Хрупкая экосистема"
eco_fragile_ecosystem_desc: "Этот мир обладает очень простой биосферой, реагирующей даже на малейшие нарушения."
eco_fragile_ecosystem_effect: "Потребление §Yудобств§! гражданами: §R+10%§!\n$mod_planet_jobs_society_research_produces_mult$: §G+10%§!\n$MOD_PLANET_MAX_DISTRICTS_ADD$: §R-1§!\n$mod_district_generator_max_add$: §R-1§!\n$mod_district_mining_max_add$: §R-1§!\n§RСобытия загрязнения на этом мире учащены.§!"
eco_species_rich: "Богатство видов"
eco_species_rich_desc: "Этот мир обладает высоким уровнем биоразнообразия, что даёт множество преимуществ для счастья его населения."
eco_species_rich_effect: "£waste£ §Y$waste$§! от £job£ рабочих мест: §G-1§!\n$mod_planet_jobs_society_research_produces_mult$: §G+10%§!\n$mod_district_farming_max_add$: §G+1§!"
eco_species_poor: "Бедность видов"
eco_species_poor_desc: "Этот мир обладает низким уровнем биоразнообразия, что снижает здоровье жизни на нём."
eco_species_poor_effect: "£waste£ §Y$waste$§! от £job£ рабочих мест: §R+1§!\n$mod_planet_jobs_society_research_produces_mult$: §R-10%§!\n$mod_district_farming_max_add$: §R-1§!"
eco_visual: "Визуальное загрязнение"
eco_visual_desc: "Уродливая инфраструктура доминирует в обитаемых регионах этого мира."
eco_visual_success: "Вдохновляющая архитектура"
eco_visual_success_desc: "Впечатляющие городские пейзажи вписываются в природную среду мира, придавая ему особый вид."
eco_visual_fail: "Промышленные джунгли"
eco_visual_fail_desc: "Клубок искорёженной технологической инфраструктуры расползается по этому миру."
eco_noise: "Шумовое загрязнение"
eco_noise_desc: "Звуки торговли и промышленности сказываются на благополучии людей."
eco_noise_success: "Звукоизоляция"
eco_noise_success_desc: "Города этого мира тихи и умиротворяющи."
eco_noise_fail: "Искажённая акустика"
eco_noise_fail_desc: "Города этого мира постоянно отдаются приглушённым звуком промышленности и торговли."
eco_light: "Световое загрязнение"
eco_light_desc: "Свет городских огней затмевает звёзды по ночам."
eco_light_success: "Мягкое освещение"
eco_light_success_desc: "Продвинутые световые системы обеспечивают беспрепятственный обзор ночного неба."
eco_light_fail: "Неприятные огни"
eco_light_fail_desc: "Ночные огни имеют неприятный оттенок, но сохраняют прекрасное ночное небо."
eco_air: "Загрязнение воздуха"
eco_air_desc: "Плохое качество воздуха — проблема здоровья на этом мире."
eco_air_success: "Чистый воздух"
eco_air_success_desc: "Воздух на этой планете исключительно чист."
eco_air_fail: "Искусственный воздух"
eco_air_fail_desc: "Искусственная атмосфера создаётся санитарными устройствами, удаляющими худшие токсины из воздуха."
eco_soil: "Загрязнение почвы"
eco_soil_desc: "Плохое качество почвы означает меньшие урожаи и токсины в продовольствии."
eco_soil_success: "Обогащённая почва"
eco_soil_success_desc: "Почва на этой планете исключительно плодородна."
eco_soil_fail: "Искусственная почва"
eco_soil_fail_desc: "Очистители питательных веществ уменьшают токсины в земле и продовольствии."
eco_water: "Загрязнение воды"
eco_water_desc: "Токсины в воде делают мир менее пригодным для жизни."
eco_water_success: "Очищенная вода"
eco_water_success_desc: "Вода на этой планете прозрачна как кристалл."
eco_water_fail: "Обработанная вода"
eco_water_fail_desc: "Вода на этой планете подвергается серьёзной обработке для снижения токсичности."
eco_climate_change: "Изменение климата"
eco_climate_change_desc: "Непредсказуемые погодные условия опасны для обитаемых районов этой планеты."
eco_collapse: "Хрупкая экосистема"
eco_collapse_tooltip: "§RДальнейшее изменение климата уничтожит этот мир!§!"
eco_collapse_desc: "Биосфера этой планеты уже переживала коллапс и находится в хрупком состоянии."
eco_ozone: "Истощение озонового слоя"
eco_ozone_desc: "Дыры в озоновом слое повысили поверхностную радиацию на планете, вредя всей биологической жизни."
eco_trash_colony: "Мусорный мир"
eco_trash_colony_desc: "Вся планета отведена под галактическую свалку."
eco_trash_colony_empire_effects: "§R+1000§! £waste£ §Y$waste$§!\nКолонии других империй:\n£waste£ §Y$waste$§! от £job£ рабочих мест: §G-1§!\n"
eco_trash_colony_other_planets: "$eco_trash_colony$"
eco_trash_colony_other_planets_desc: "$eco_trash_colony_desc$"
eco_trash_colony_other_planets_tooltip: "£waste£ §Y$waste$§! от £job£ рабочих мест: §G-1§!"
eco_displaced_wildlife: "Вытесненная дикая природа"
eco_displaced_wildlife_desc: "Разрастание городов вытеснило местную дикую природу, которая теперь бродит по населённым районам в поисках еды и крова, нанося мелкий ущерб и создавая проблемы здоровья и безопасности в затронутых районах."
eco_displaced_wildlife_2: "Вытесненная дикая природа"
eco_displaced_wildlife_2_desc: "Разрастание городов вытеснило опасную дикую природу, которая теперь охотится в населённых районах в поисках еды и крова, нанося мелкий ущерб и создавая серьёзные проблемы здоровья и безопасности в затронутых районах."
eco_displaced_wildlife_3: "Вытесненные титаны"
eco_displaced_wildlife_3_desc: "Разрастание городов вытеснило местную титаническую жизнь, которая теперь бродит по населённым районам в поисках еды и крова, нанося колоссальный ущерб и создавая проблемы здоровья и безопасности в затронутых районах."
eco_drought: "Засуха"
eco_drought_desc: "Жизнь дороже золота, но не дороже пресной воды."
eco_flooding: "Наводнение"
eco_flooding_desc: "Когда потоп затопляет всю округу, ни одна капля дождя не чувствует при этом своей вины."
eco_heat_wave: "Волна жары"
eco_heat_wave_desc: "Повторение, как и трение, скорее порождает жар, чем прогресс."
eco_outbreak: "Вспышка"
eco_outbreak_desc: "Правда в том, что нет ничего менее сенсационного, чем мор, и в силу самой своей длительности великие беды однообразны."
eco_contamination: "Заражение"
eco_contamination_desc: "Вредные органические разрастания вызывают болезни на станции."
eco_smugglers: "Логово контрабандистов"
eco_smugglers_desc: "Самые заброшенные отсеки станции стали домом для криминального подполья."
eco_smugglers_pops: "$eco_smugglers$"
eco_smugglers_pops_desc: "$eco_smugglers_desc$"
eco_controversy: "Спорное прошлое"
eco_controversy_desc: "Радикально разные взгляды на историю этого мира породили сомнения и нестабильность в умах его людей."
# Decision Modifiers
eco_overconsumption: "Сверхпотребление"
eco_overconsumption_desc: "Вы не можете управлять своим населением силой, но его можно отвлечь потреблением."
eco_overpopulated: "Перенаселение"
eco_overpopulated_desc: "Футурологи не считают перенаселение одной из проблем будущего. Они считают его проблемой будущего."
eco_clean_up: "Инициатива по очистке планеты"
eco_clean_up_desc: "Местные работники по отходам усердно трудятся, очищая планетарное опустошение."
eco_clean_up_tooltip: "§YОпустошение§! сокращается быстрее.\n§Y$job_waste_handler_plural$§! уменьшают негативные последствия после Космической бури.\nСодержание £job_waste_handler£ энергии: §R+1§!\n\n§HЭтот модификатор будет автоматически снят после очистки планеты.§!"



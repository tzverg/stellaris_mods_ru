# Waste Tech
eco_tech_waste_processing_0: "Управление отходами"
eco_tech_waste_processing_0_effect: "£pop£ граждане производят £waste£ §Y$waste$§! в зависимости от их категории."
eco_tech_waste_processing_0_desc: "Сортирует и перерабатывает вредные побочные продукты промышленности и домашней жизни."
eco_tech_waste_processing_1: "Промышленный симбиоз"
eco_tech_waste_processing_1_desc: "Создаёт динамичные симбиотические взаимосвязи между тяжёлой промышленностью и природными системами, чтобы снизить нарушения биосферы планеты."
eco_tech_waste_processing_2: "Промышленный метаболизм"
eco_tech_waste_processing_2_desc: "Полностью интегрирует промышленные практики в естественные циклы экосистемы, чтобы ещё больше снизить непреднамеренные нестабильности."
eco_tech_waste_processing_3: "Индустрия нулевых отходов"
eco_tech_waste_processing_3_desc: "Использует тёмную материю для преобразования отходов либо в какую-то материю, которую мы пока не можем наблюдать, либо вообще в ничто. Мы не уверены. Вероятно, это безопасно."

eco_tech_waste_processing_wilderness_0: "$eco_tech_waste_processing_0$"
eco_tech_waste_processing_wilderness_0_desc: "Детритосимбионты разлагают нежелательную материю, возвращая питательные вещества обратно в биосферу."
eco_tech_waste_processing_wilderness_0_effect: "£building£ $building_cradle_of_rebirth$ даёт некоторые должности $job_detritisymbiont$\n£pop£ граждане производят £waste£ §Y$waste$§! в зависимости от их категории."
eco_tech_waste_processing_wilderness_1: "$eco_tech_waste_processing_1$"
eco_tech_waste_processing_wilderness_1_desc: "Промышленные процессы, необходимые для межзвёздного господства, требуют новых практик для минимизации непреднамеренных нестабильностей в наших экосистемах."
eco_tech_waste_processing_wilderness_effect: "£building£ $building_cradle_of_rebirth$ даёт дополнительные должности $job_detritisymbiont$"
eco_tech_waste_processing_wilderness_2: "$eco_tech_waste_processing_2$"
eco_tech_waste_processing_wilderness_2_desc: "Наши промышленные симбионты полностью интегрировались в естественные циклы наших биосфер."
eco_tech_waste_processing_wilderness_3: "$eco_tech_waste_processing_3$"
eco_tech_waste_processing_wilderness_3_desc: "С интеграцией передовых технологий наши детритосимбионты могут перерабатывать нежелательные отходы быстрее, чем когда-либо прежде."

eco_tech_waste_recycling: "Переработка отходов"
eco_tech_waste_recycling_desc: "Улучшенная переработка материалов приводит к снижению загрязнения от производства и увеличению количества переработанных материалов."
eco_tech_waste_recycling_tooltip: "£job_waste_handler£ Работники по отходам дополнительно снижают £waste£ §Y$waste$§! на §Y+10§!"
eco_tech_waste_recycling_2: "Продвинутая переработка отходов"
eco_tech_waste_recycling_2_desc: "Продвинутые методы переработки максимизируют нашу способность превращать нежелательные отходы в сырьё."
co_tech_waste_recycling_2_tooltip: "Открывает §Yполитики продвинутого управления отходами§!"
eco_tech_waste_recycling_3: "Предотвращение отходов"
eco_tech_waste_recycling_3_desc: "Самый устойчивый способ — не производить вещи. Второй по устойчивости способ — сделать что-то очень полезное, чтобы решить проблему, которая ещё не была решена."
eco_tech_waste_recycling_3_tooltip: "£waste£ §Y$waste$§! от £job£ рабочих мест: §G-1§!"
eco_tech_trash_colonies: "Мусорные миры"
eco_tech_trash_colonies_desc: "Назначьте целый мир для использования в качестве утилизации отходов. Значительно снижает загрязнение на всех других планетах в ваших границах."
eco_tech_planetary_restoration: "Планетарное восстановление"
eco_tech_planetary_restoration_desc: "То, чего экологически неграмотные не понимают об экосистеме, — это то, что она система. Система! Система поддерживает определённую текучую стабильность, которая может быть разрушена неверным шагом лишь в одной нише. У системы есть порядок, перетекающий от точки к точке. Если что-то запрудит этот поток, порядок рушится. Необученный может не заметить этот коллапс, пока не станет слишком поздно."

# Waste Tech Ascendancy
tech_repeatable_waste_worker_production: "Оптимизация управления отходами"
tech_repeatable_waste_worker_production_desc: "Постепенные достижения в управлении отходами позволят нам утилизировать наши отходы всё более экологичными методами."
tech_repeatable_waste_worker_production_hive_mind: "Улучшение систем отходов"
tech_repeatable_waste_worker_production_desc_hive_mind: "Мы должны искать всё более эффективные способы не давать нашим отходам влиять на эффективность нашего коллектива."
tech_repeatable_waste_worker_production_machine_intelligence: "$tech_repeatable_waste_worker_production_hive_mind$"
tech_repeatable_waste_worker_production_desc_machine_intelligence: "$tech_repeatable_waste_worker_production_desc_hive_mind$"

tech_repeatable_civilian_waste_reduction: "Гражданская санитария"
tech_repeatable_civilian_waste_reduction_desc: "Улучшенные программы гражданской переработки и санитарии позволят нам остановить часть отходов до того, как они появятся."
tech_repeatable_maintenance_drone_waste_reduction: "Распределённые санитарные дроны"
tech_repeatable_maintenance_drone_waste_reduction_desc: "Разработка улучшенных методов санитарии позволит нашим ремонтным дронам более эффективно удалять нежелательные отходы из нашего коллектива."
# Drought
disaster.100.name: "Засуха на [Root.GetName]"
disaster.100.desc: "[Root.GetName] пострадала от засухи, что значительно снизило производство продовольствия и угрожает верхнему слою почвы, пока она не пройдёт."
disaster.100.desc.heavy: "[Root.GetName] пострадала от сильной засухи, что значительно снизило производство продовольствия и угрожает верхнему слою почвы, пока она не пройдёт."
disaster.100.desc.extreme: "[Root.GetName] пострадала от экстремальной засухи, что значительно снизило производство продовольствия и подвергает опасности верхний слой почвы, пока она не пройдёт."
disaster.100.desc.cata: "[Root.GetName] пострадала от катастрофической засухи, что значительно снизило производство продовольствия и уничтожает верхний слой почвы, пока она не пройдёт."
# Flooding
disaster.110.name: "Наводнение на [Root.GetName]"
disaster.110.desc: "Быстрое наводнение на [Root.GetName] вынудило жителей покинуть свои дома, пока вода не отступит."
disaster.110.desc.heavy: "Сильное наводнение на [Root.GetName] вынудило жителей покинуть свои дома и повредило местность. Потребуется время, чтобы вода отступила."
disaster.110.desc.extreme: "Экстремальное наводнение на [Root.GetName] вынудило жителей покинуть свои дома и повредило местность. Пройдёт немало времени, прежде чем вода отступит."
disaster.110.desc.cata: "Катастрофическое наводнение на [Root.GetName] вынудило жителей покинуть свои дома и нанесло значительный ущерб местности. Пройдёт очень много времени, прежде чем вода отступит."
# Heat Wave
disaster.120.name: "Волна жары на [Root.GetName]"
disaster.120.desc: "[Root.GetName] переживает не по сезону тёплую погоду. Это может быть признаком того, что климат становится менее стабильным."
disaster.120.desc.heavy: "[Root.GetName] переживает не по сезону тёплую погоду. Это может вызвать другие нежелательные изменения в её климате."
disaster.120.desc.extreme: "[Root.GetName] переживает не по сезону тёплую погоду, которая угрожает её уже подорванному климату."
disaster.120.desc.cata: "[Root.GetName] переживает не по сезону тёплую погоду, которая может ускорить её движение к экологическому коллапсу."
# Outbreak
disaster.130.name: "Вспышка на [Root.GetName]"
disaster.130.desc: "Болезнь поразила [Root.GetName], принеся низкий риск смертельных исходов и резко снизив рост населения, пока она не пройдёт."
disaster.130.desc.heavy: "Болезнь поразила [Root.GetName], принеся риск смертельных исходов и резко снизив рост населения, пока она не пройдёт."
disaster.130.desc.extreme: "Болезнь поразила [Root.GetName], принеся серьёзный риск смертельных исходов и резко снизив рост населения, пока она не пройдёт."
disaster.130.desc.cata: "Болезнь поразила [Root.GetName], принеся смертельные исходы и резко снизив рост населения, пока она не пройдёт."
# Slums (Regular}
disaster.140.name: "Бездомность на [Root.GetName]"
disaster.140.desc: "Нехватка жилья для удовлетворения потребностей населения на [Root.GetName] привела к росту трущобных городков. Требуется больше жилья, чтобы вернуть это население в рабочую силу."
# Slums (Hive}
disaster.150.name: "Обрушение норы на [Root.GetName]"
disaster.150.desc: "Нора обрушилась на [Root.GetName] из-за чрезмерной заселённости и перегрузки. Строительство дополнительных нор предотвратит это в будущем."
# Fires
disaster.160.name: "[Root.GetName] горит"
disaster.160.desc: "Пожары бушуют по поверхности [Root.GetName], уничтожая всё и всех на своём пути."
# Soil Erosion
degrade.100.name: "Эрозия почвы"
degrade.100.desc: "Регион [Root.GetName] потерял верхний слой почвы из-за интенсивного использования. Сокращение производства или снижение загрязнения может предотвратить это в будущем."
# Water Contamination
degrade.110.name: "Загрязнение воды"
degrade.110.desc: "Вода [Root.GetName] становится всё более загрязнённой промышленными стоками. Сократите промышленность или уменьшите загрязнение, чтобы предотвратить это в будущем."
# Ozone Depletion
degrade.120.name: "Истощение озонового слоя"
degrade.120.desc: "На [Root.GetName] образуются дыры в озоновом слое из-за избытка промышленных побочных продуктов. Сокращение промышленности или уменьшение загрязнения предотвратит дальнейшее образование этих дыр."
# Junkheap
degrade.130.name: "Хламовая куча"
degrade.130.desc: "Отходы на [Root.GetName] нагромоздились в собственную среду обитания и достаточно велики, чтобы использовать их как природный ресурс сам по себе. Мы могли бы очистить её, если сосредоточим глобальные усилия на [Root.GetName] в направлении переработки отходов."
# Biodiversity Loss
degrade.140.name: "Потеря биоразнообразия"
degrade.140.desc: "Темпы вымирания на [Root.GetName] растут значительно выше среднего. Без быстрого и дорогостоящего вмешательства это ускорит рост загрязнения на [Root.GetName]."
# Exploitation
degrade.150.name: "[Root.GetName] полностью расширена"
degrade.150.desc: "Города [Root.GetName] достигли своего максимального рекомендованного размера. Дальнейшее разрастание всё ещё возможно, но оно негативно скажется на окружающей среде планеты.\n\n§YЭто решение можно принять только один раз.§!"
degrade.150.a: "Риск того стоит."
degrade.150.b: "Окружающая среда важнее."
# Exploitation 2
degrade.160.name: "[Root.GetName] переразвита"
degrade.160.desc: "Расширение [Root.GetName] превысило рекомендуемые пределы и работает выше мощности. Хотя это не рекомендуется, можно продолжить расширение в последние оставшиеся области планеты.\n\n§YЭто решение можно принять только один раз.§!"
degrade.160.a: "Мы доведём этот мир до предела."
degrade.160.b: "Мы не можем себе этого позволить."
# Displaced Wildlife
degrade.170.name: "Вытесненная дикая природа"
degrade.170.desc: "Расширение нового района на [Root.GetName] вытеснило часть местной дикой природы, которая когда-то называла эту область домом. Вместо того чтобы исчезнуть, [Root.GetName] видит всё больше и больше дикой природы, пытающейся охотиться и гнездиться в её городских районах."
# Noise Pollution Event
degrade.180.name: "Шумовое загрязнение"
degrade.180.desc: "По мере роста населения мира [Root.GetName] растёт и производимый им шум. Если ничего не предпринять, граждане начнут страдать от беспокойных ночей, а посетители будут недовольны."
degrade.180.a: "Убрать самых шумных представителей подальше от гутонаселённых районов."
degrade.180.b: "Спроектировать звукоизоляцию вокруг обитаемых районов."
degrade.180.mat: "Внедрить передовые технологии звуконепроницаемости."
degrade.180.spirit: "Переселить наиболее пострадавшее население в более изолированное жильё."
degrade.180.c: "Разобраться с этим позже."
degrade.181.name: "Звукоизолировано"
degrade.181.desc: "На [Root.GetName] установлены системы снижения шума, которые должны улучшить благополучие людей, живущих и работающих там."
degrade.182.name: "Шумоподавление"
degrade.182.desc: "Попытки снизить уровень шума на [Root.GetName] увенчались частичным успехом. Этого должно хватить, чтобы минимизировать нежелательные звуки в наиболее важных областях."
ECO_NOISE_POLLUTION_PROJECT: "Звукоизоляция"
ECO_NOISE_POLLUTION_PROJECT_DESC: "Спроектировать новые системы звукоизоляции для населённых сред."
# Light Pollution Event
degrade.190.name: "Световое загрязнение"
degrade.190.desc: "По мере роста населения на [Root.GetName] растёт и количество источников света. Всё более ограничивая видимость ночного неба мира [Root.GetName], чем затрудняет работу наших наблюдательных станций."
degrade.190.a: "Убрать световое загрязнение вокруг обсерваторий."
degrade.190.b: "Спроектировать системы освещения, сохраняющие ночь."
degrade.190.phobe: "Сократить освещение везде кроме самых важных областей."
degrade.190.phile: "Заменить стационарные источники освещения на переносные."
degrade.190.c: "Разобраться с этим позже."
degrade.191.name: "Умное освещение"
degrade.191.desc: "Новые огни на [Root.GetName] развёрнуты и работают именно так, как задумано, давая всем нашим обсерваториям беспрепятственный вид на космос."
degrade.192.name: "Неприятное освещение"
degrade.192.desc: "Новые огни установлены на [Root.GetName], но находиться рядом с ними не очень комфортно. Тем не менее, мы достигли нашей основной цели."
ECO_LIGHT_POLLUTION_PROJECT: "Ночные огни"
ECO_LIGHT_POLLUTION_PROJECT_DESC: "Спроектировать освещение для урбанизированных областей, сохраняющее красоту ночного неба."
# Air Pollution Event
degrade.200.name: "Загрязнение воздуха"
degrade.200.desc: "Воздух на [Root.GetName] стал настолько токсичным, что начинает влиять на здоровье его жителей. Нужно срочно что-то сделать, если мы хотим предотвратить дальнейший ущерб."
degrade.200.spirit: "Провести ритуал исправления климата."
degrade.200.a: "Очистить воздух от токсинов."
degrade.200.b: "Установить планетарную систему очистки воздуха, чтобы справиться с этим."
degrade.200.c: "Игнорировать."
degrade.201.name: "Очиститель воздуха запущен"
degrade.201.desc: "Система очистки воздуха на [Root.GetName] оказалась успешной! Не должно быть необходимости снова беспокоиться о качестве воздуха на [Root.GetName]."
degrade.202.name: "Искусственный воздух запущен"
degrade.202.desc: "Это не идеально, но система санитарии воздуха на [Root.GetName] должна предотвратить попадание худших токсинов в атмосферу, даже если она не производит действительно лучший воздух."
degrade.203.name: "Загрязнение воздуха ухудшается"
degrade.203.desc: "Люди [Root.GetName] страдают от ухудшающегося качества воздуха. Токсичный дождь начал повреждать инфраструктуру. Это будет продолжаться, пока проблема не будет решена."
degrade.203.a: "Очистить воздух от токсинов."
degrade.203.b: "Установить планетарную систему очистки воздуха, чтобы справиться с этим."
degrade.203.c: "Игнорировать."
ECO_AIR_POLLUTION_PROJECT: "Проект очистки воздуха"
ECO_AIR_POLLUTION_PROJECT_DESC: "Внедрить экспериментальную планетарную систему очистки воздуха, которая должна защитить атмосферу от дальнейшего загрязнения."
# Soil Pollution Event
degrade.210.name: "Загрязнение почвы"
degrade.210.desc: "Питательные вещества в почве [Root.GetName] истощаются, и продовольствие проявляет признаки повышенной токсичности. Если ничего не предпринять, может произойти коллапс сельского хозяйства."
degrade.210.pac: "Создать богатую питательными веществами почву."
degrade.210.a: "Очистить пострадавшую землю."
degrade.210.b: "Установить систему очистки почвы."
degrade.210.c: "Игнорировать."
degrade.211.name: "Успех системы очистки"
degrade.211.desc: "Запасы продовольствия на [Root.GetName] теперь защищены от дальнейшего загрязнения, и следует ожидать улучшения урожайности."
degrade.212.name: "Системы искусственной почвы"
degrade.212.desc: "[Root.GetName] теперь защищена от загрязнённых запасов продовольствия, но ценой дополнительной обработки и снижения урожайности."
degrade.213.name: "Загрязнённое продовольствие"
degrade.213.desc: "Ситуация на [Root.GetName] продолжает ухудшаться по мере ухудшения состояния почвы. Необходимо принять решение, чтобы предотвратить дальнейший ущерб.\n\nНа [Root.GetName] добавлено §Rпланетарное препятствие§!."
degrade.213.a: "Очистить пострадавшую землю."
degrade.213.b: "Установить систему очистки почвы."
degrade.213.c: "Игнорировать."
ECO_SOIL_POLLUTION_PROJECT: "Система очистки почвы"
ECO_SOIL_POLLUTION_PROJECT_DESC: "Внедрить планетарную систему восстановления почвы, чтобы защитить запасы продовольствия от дальнейшего загрязнения."
# Water Pollution Event
degrade.220.name: "Загрязнение воды"
degrade.220.desc: "Растущая токсичность воды мира [Root.GetName] угрожает здоровью каждого живого организма на планете. Если ничего не предпринять, это может нанести ущерб всей биосфере планеты."
degrade.220.phile: "Построить объекты охранения водной среды."
degrade.220.a: "Очистить запасы воды."
degrade.220.b: "Установить систему очистки воды."
degrade.220.c: "Игнорировать."
degrade.221.name: "Очистка воды завершена"
degrade.221.desc: "Водные ресурсы мира [Root.GetName] полностью очищены. Проект признан полностью успешным."
degrade.222.name: "Начинается обработка воды"
degrade.222.desc: "ПРоточная фильтрация запасов воды мира [Root.GetName] должна снизить воздействие загрязнения на экосистемы планеты."
degrade.223.name: "Токсичный ил"
degrade.223.desc: "По мере дальнейшей деградации воды на [Root.GetName] районы, когда-то идеальные для проживания, становятся непригодными для жизни.\n\nНа [Root.GetName] добавлено §Rпланетарное препятствие§!"
degrade.223.a: "Очистить запасы воды."
degrade.223.b: "Установить систему очистки воды."
degrade.223.c: "Игнорировать."
ECO_WATER_POLLUTION_PROJECT: "Система очистки воды"
ECO_WATER_POLLUTION_PROJECT_DESC: "Установить систему очистки воды, чтобы предотвратить дальнейшее загрязнение биосферы планеты."
# Visual Pollution Event
degrade.230.name: "Визуальное загрязнение"
degrade.230.desc: "Растущая инфраструктура [Root.GetName] доминирует в общественных пространствах и транспортных сетях, стирая любое чувство культурной и национальной идентичности. Если ничего не предпринять, [Root.GetName] станет просто ещё одним типовым местом для жизни в галактике."
degrade.230.a: "Убрать инфраструктуру с глаз долой."
degrade.230.b: "Найти способ сделать инфраструктуру более привлекательной."
degrade.230.auth: "Скрыть инфраструктуру патриотическими образами."
degrade.230.egal: "Дать местным художникам материалы, чтобы сделать её красивее."
degrade.230.c: "Разобраться с этим позже."
degrade.231.name: "Инфраструктура переработана"
degrade.231.desc: "Местная инфраструктура была успешно переработана во что-то привлекательное для местной культуры. [Root.GetName] сразу становится известна своим вдохновенным архитектурно-техническим дизайном."
degrade.232.name: "Инфраструктурный кошмар"
degrade.232.desc: "Города [Root.GetName] теперь представляют собой море труб, проводов, антенн и других промышленных элементов. Легко заблудиться на его лабиринтных улицах или потерять себя среди его гудящих механизмов."
ECO_VISUAL_POLLUTION_PROJECT: "Инфраструктурный дизайн"
ECO_VISUAL_POLLUTION_PROJECT_DESC: "Переработать планетарную инфраструктуру во что-то, отражающее местную культуру."
# Generator Depletion
depletion.100.name: "Генератор на [Root.GetName] истощён"
depletion.100.desc: "Регион [Root.GetName] исчерпал энергию для наших генераторов. Чем больше потенциальной выработки энергии планеты мы используем, тем чаще это будет происходить в будущем."
# Mining Depletion
depletion.110.name: "Шахта на [Root.GetName] истощена"
depletion.110.desc: "Регион [Root.GetName] исчерпал пригодные минералы. Чем больше потенциальной добычи минералов планеты мы используем за раз, тем чаще это будет повторяться."
# Farming Depletion
depletion.120.name: "Ферма на [Root.GetName] истощена"
depletion.120.desc: "Регион [Root.GetName] стал непригодным для растительности. Максимизация потенциального производства продовольствия планеты увеличивает шанс, что это будет происходить чаще."
# Environmental Restoration
ecology.110.name: "Восстановление окружающей среды"
ecology.110.desc: "Наши усилия по очистке на [Root.GetName] окупились. Поля хлама расчищены, открывая место для дополнительного развития."
# Improved Resilience
ecology.120.name: "Экосистема [Root.GetName] улучшена"
ecology.120.desc: "Биосфера [Root.GetName] стала более устойчивой, снижая частоту и серьёзность экологических нарушений."
# Improved Resilience
ecology.130.name: "Экосистема [Root.GetName] ослаблена"
ecology.130.desc: "Биосфера [Root.GetName] стала менее устойчивой, увеличивая частоту и серьёзность экологических нарушений."
# Planet is Changing
climate.100.name: "[Root.GetName] меняется"
climate.100.desc.arctic: "[Root.GetName] нагревается. Ледяные щиты тают, обнажая скалы и океан. Если это продолжится, поверхность планеты может измениться навсегда."
climate.100.desc.arid: "[Root.GetName] остывает, поскольку твёрдые частицы в воздухе снижают солнечное тепло на поверхности. Если это продолжится, земля замёрзнет по всей планете."
climate.100.desc.cont: "[Root.GetName] становится жарче, поскольку парниковые газы удерживают солнечную радиацию в виде тепловой энергии. Если это продолжится, планета станет враждебной и засушливой."
climate.100.desc.ocean: "[Root.GetName] нагревается, и океаны отступают в атмосферу. Если это продолжится, пляжи мира расширятся в безжизненные пустыни."
climate.100.desc.trop: "[Root.GetName] становится жарче, и дожди замедляются. Если это продолжится, мягкий и влажный климат станет враждебным и нерегулярным."
climate.100.desc.alpine: "[Root.GetName] нагревается. Снега тают с высокогорий, и уровень воды поднимается. Если это продолжится, по всей планете возникнут многие новые среды."
climate.100.desc.tundra: "[Root.GetName] нагревается, высвобождая сохранённые органические материалы из вечной мерзлоты. Если это продолжится, планета покроется дождями и зарастёт растительностью."
climate.100.desc.desert: "[Root.GetName] остывает, поскольку промышленные частицы затемняют небо. Если это продолжится, иней нарастёт в ледяные щиты, превратив планету в замёрзшую пустыню."
climate.100.desc.savannah: "[Root.GetName] остывает, поскольку загрязнение затемняет небеса. Если это продолжится, зимы станут длиннее, и земля начнёт замерзать."
climate.100.desc.gaia: "[Root.GetName] ухудшается, поскольку тёплые регионы становятся жарче, а прохладные — холоднее. Если это продолжится, она больше не будет тем раем, которым является сейчас."
climate.100.a: "Попытаться замедлить таяние льда."

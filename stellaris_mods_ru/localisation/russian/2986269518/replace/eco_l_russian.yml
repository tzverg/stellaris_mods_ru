# Ecology Origins
origin_ecology: "Устойчивое развитие"
origin_ecology_desc: "Эта цивилизация развивалась через тщательное использование земли и ресурсов, что привело к необычайно чистому родному миру и стабильному фундаменту для общества, стремящегося к экспансии на другие миры."
origin_ecology_effects: "Родной мир получает §Yустойчивую экосистему§!, §Yгородской парк§!, дополнительные §Yзалежи§!, естественные £blocker£ §Yпрепятствия§!, а £planet£ §Yразмер планеты§! равен §G20§!.\n\nВключает дополнительных £pop£ §Yпоселенцев§!."


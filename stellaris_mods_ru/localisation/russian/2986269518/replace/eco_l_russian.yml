eco_civic_scavenger_toxoid_effects: "Исследование §Yобломков§! даст как §Yисследования§!, так и часть других §Yстоимостей ресурсов§! уничтоженного флота.\n§YКорабли§! могут быть восстановлены из некоторых §Yобломков§!.\n£job_waste_drone£ $job_waste_drone_plural$ и £job_waste_overseer£ $job_waste_overseer_plural$ производят §Y1§! £food£ §Y$food$§!"
eco_civic_scavenger_lithoid_toxoid_effects: "Исследование §Yобломков§! даст как §Yисследования§!, так и часть других §Yстоимостей ресурсов§! уничтоженного флота.\n§YКорабли§! могут быть восстановлены из некоторых §Yобломков§!.\n£job_waste_drone£ $job_waste_drone_plural$ и £job_waste_overseer£ $job_waste_overseer_plural$ производят §Y1§! £minerals£ §Y$minerals$§!"

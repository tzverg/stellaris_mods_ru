d_eco_city_park_tt: "Городские районы дают дополнительные £amenities£ §G$amenity$§! и £waste£ §Gснижение отходов§!, но предоставляют §Rменьшее количество§! £building£ ['concept_housing', жилья] и повышенное §Rсодержание§!"
d_eco_park: "Национальный парк"

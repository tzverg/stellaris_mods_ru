# Change Minimized
climate.101.name: "Изменение [Root.GetName] минимизировано"
climate.101.desc.arctic: "Изменения [Root.GetName] были минимизированы, но планета была изменена таянием части её льда."
climate.101.desc.arid: "Изменения [Root.GetName] были минимизированы, но планета была изменена пониженными температурами."
climate.101.desc.cont: "Изменения [Root.GetName] были минимизированы, но планета была изменена повышающимися температурами."
climate.101.desc.ocean: "Изменения [Root.GetName] были минимизированы, но планета потеряла часть своих океанов, оставив их дно открытым воздуху."
climate.101.desc.trop: "Изменения [Root.GetName] были минимизированы, но планета уже не такая кроткая, как раньше."
climate.101.desc.alpine: "Изменения [Root.GetName] были минимизированы, но планета уже не такая однородная, как когда-то."
climate.101.desc.tundra: "Изменения [Root.GetName] были минимизированы, но часть земли оттаяла, высвободив накопленные газы в атмосферу."
climate.101.desc.desert: "Изменения [Root.GetName] были минимизированы, но некоторые регионы планеты охладились и покрываются инеем."
climate.101.desc.savannah: "Изменения [Root.GetName] были минимизированы, но часть земли навсегда замёрзла из-за снижающихся температур."
climate.101.desc.gaia: "Изменения [Root.GetName] были минимизированы, но ландшафт потерял часть своей идиллической красоты."
# Change Complete
climate.102.name: "Изменение климата на [Root.GetName]"
climate.102.desc.arctic: "Мир [Root.GetName] полностью растаял и теперь покрыт огромным количеством жидкой воды. Планета нагрелась, и воздух повысил влажность. Жизнь, приспособленная к Арктике, с трудом адаптируется к этой новой среде."
climate.102.desc.arid: "[Root.GetName] почти полностью замёрзла. Иней остаётся там, где вода когда-то сезонно проходила. Жизнь, приспособленная к долгим летам и климатическим сезонам дождей, теперь готовится к зиме, у которой нет конца."
climate.102.desc.cont: "[Root.GetName] — гораздо более жаркая и сухая планета, чем была раньше. Сухие реки и озёра пересекают ландшафт, и жизнь с трудом выживает в немногих местах, где ещё процветает растительность."
climate.102.desc.ocean: "[Root.GetName] потеряла большую часть своих океанов. Сухие морские днища и океанские дна обнажены по поверхности, а скелетные останки океанской жизни выцвели на солнце нового мира."
climate.102.desc.trop: "[Root.GetName] потеряла свой мягкий климат, который сменился долгими засухами, прерываемыми проливными дождями. Жизнь с трудом выживает в этой менее снисходительной среде."
climate.102.desc.alpine: "[Root.GetName] потеряла большую часть своего льда и теперь является домом для новых рек и океанов. Жизнь, приспособленная к постоянному холоду, теперь должна иметь дело с тёплыми водами и меняющимися сезонами."
climate.102.desc.tundra: "[Root.GetName] потеряла почти всю свою вечную мерзлоту. Воздух стал тёплым и влажным, а земля — мокрой и покрытой растительностью, которая теперь вышла из-под контроля в новом климате."
climate.102.desc.desert: "[Root.GetName] полностью замёрзла, поскольку Арктика распространилась по всей её поверхности. Жизнь, привыкшая к экстремальной жаре, теперь должна попытаться выжить в экстремальном холоде."
climate.102.desc.savannah: "[Root.GetName] остыла до такой степени, что большая часть её земли теперь замёрзла. Растительность поредела, а тёплые воды уступили место снегу и льду. Дикая природа редеет в этой новой ледяной среде."
climate.102.desc.gaia: "[Root.GetName] превратилась в мир с более суровыми биомами, нерегулярными погодными условиями и перемежающимися стихийными бедствиями. Жизнь должна узнать, что значит бороться за выживание в неумолимой среде."

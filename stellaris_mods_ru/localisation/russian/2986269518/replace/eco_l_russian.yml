d_eco_preserve: "Заповедник дикой природы"
d_eco_preserve_desc: "Регион земли, нежелательный для застройки, отведён под естественную среду обитания планеты, защищая природную среду от загрязнения."
d_eco_preserve_hive: "Заповедник дикой природы"

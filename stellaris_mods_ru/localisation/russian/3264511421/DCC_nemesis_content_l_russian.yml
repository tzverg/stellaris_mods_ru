l_russian:

 #######################################
 # Dux' Crisis Custodian
 #######################################
 
 crisis_custodian: "Кризисный Хранитель"
 resolution_category_crisis_custodian: "Кризисный Хранитель"
 resolution_CrisisCustodian_nominate_custodian: "Выдвинуть кандидатуру Кризисного Хранителя"
 resolution_CrisisCustodian_nominate_custodian_desc: "Мы защищаем то, что принадлежит нам."
 
 
 DCC.1.name: "Кризисный Хранитель v1.1"
 DCC.1.desc: "Желаете изменить штрафные санкции за высказывание мнения в условиях кризиса?"
 DCC.1.a: "Да."
 DCC.1.b: "Нет."
 
 DCC.2.name: "Настройки Кризисного Хранителя 1"
 DCC.2.desc: "Желаете, чтобы штрафные санкции за кризисное мнение уменьшались?"
 
 DCC.2.a0: "§GВключить§! снижение штрафа «Защитника Галактики»."
 DCC.2.a1: "§RОтключить§! снижение штрафа «Защитника Галактики»."
 
 DCC.2.b0: "§GВключить§! «Защитник Галактики» vs «Кризис»."
 DCC.2.b1: "§RОтключить§! «Защитник Галактики» vs «Кризис»."
 
 DCC.2.c0: "§GВключить§! снижение штрафа «Защитника Галактики» или «Императора»."
 DCC.2.c1: "§RОтключить§! снижение штрафа «Защитника Галактики» или «Императора»."
 
 DCC.2.d0: "§GВключить§! снижение штрафа «Защитника Галактики» или «Императора» vs «Кризис»."
 DCC.2.d1: "§RОтключить§! снижение штрафа «Защитника Галактики» или «Императора» vs «Кризис»."
 
 DCC.2.e: "Приступить."
 
 DCC.2.tooltip: "Условия приводят к дополнительному снижению штрафов за мнения, не вызвавших реакцию. Они не влияют на штрафы за мнения, вызвавшие реакцию."
 
 DCC.3.name: "Настройки Кризисного Хранителя 2"
 DCC.3.desc: "Хотели бы вы, чтобы штрафы за высказывания в кризисной ситуации были уменьшены?"
 DCC.3.a: "Да, на §R20%§!."
 DCC.3.b: "Да, на §H40%§!."
 DCC.3.c: "Да, на §Y60%§!."
 DCC.3.d: "Да, на §G80%§!."
 DCC.3.e: "Нет."
 
 DCC.4.name: "Настройки Кризисного Хранителя 3"
 DCC.4.desc: "Хотите, чтобы штрафы за высказывания, вызванные кризисом, со временем уменьшались?"
 DCC.4.a: "Да, на §B10% ежемесячно, Я провожу отладку§!."
 DCC.4.b: "Да, на §G10% каждый год§!."
 DCC.4.c: "Да, на §H10% каждые пять лет§!."
 DCC.4.d: "Да, на §Y10% каждый десятилетие§!."
 DCC.4.e: "Да, на §R10% каждые 25 лет§!."
 DCC.4.f: "Нет."
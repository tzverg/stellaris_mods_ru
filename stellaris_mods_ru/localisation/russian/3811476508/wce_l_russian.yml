l_russian:
 # resources
 urp_211: "Осуждение"
 urp_211_desc: "Показатель того, как именно галактика воспринимает нашу внешнюю политику. Возрастает при проведении жестоких бомбардировок, остеклении колоний, чистках и жестоком обращении с заключёнными. В мирное время снижается на §G0.25§! ежемесячно.\n\n§H25§!: Постыдный\n§H50§!: Бесчестный - на этом уровне другие галактические государства получают законный §Y$casus_belli_cb_wce_crimes_against_the_galaxy$§! §H«Casus Belli»§!\n§H75§!: Отверженный"
 urp_212: "Военнопленные"
 urp_212_desc: "Экипажи судов противника, извлеченные из обломков уничтоженных нами кораблей, солдаты из разгромленных нами армий и шпионы, пойманные нами у себя в тылу. Решайте их судьбу при помощи §YРешений§!, принимаемых на нашей столице."
 mod_country_base_urp_211_produces_add: "$urp_211$ ежемесячно"
 wce_infamy_decay: "Снижение Осуждения"
 wce_infamy_decay_desc: "Когда орбитальные орудия умолкают, галактика постепенно забывает о том, какие ужасы мы все творили."

 # organs and biomarkers
 urp_213: "Извлечённые Органы"
 urp_213_desc: "Органы, извлечённые из тел военнопленных. Они всегда пользуются спросом на Галактическом Рынке, пополняют §YБанков Органов§! и используются во время §YПрограмм Трансплантации§!.\n\nПока закон §Y$resolution_wce_treatment_of_the_captured$§! имеет силу, участники Галактического Сообщества не могут открыто торговать ими на Галактическом Рынке."
 urp_214: "Биомаркеры Доноров"
 urp_214_desc: "Образцы тканей, антитела и генетические маркеры, добровольно предоставленные заключёнными перед своим окончательным освобождением из плена. Они пополняют §Y«Клиники Генной Терапии»§! и используются §Y«Инициативами Общественного Здравоохранения»§!. Этот ресурс нельзя продавать."

 policy_wce_prisoner_program: "Содержание Военнопленных"
 policy_wce_prisoner_program_desc: "Что происходит с захваченными во время конфликта военнопленными? В рамках этих программ ежемесячно обрабатывается до §Y10§! (операций) или §Y5§! (регистраций) военнопленных."
 wce_prisoner_standard_name: "$wce_prisoner_program_standard$"
 wce_prisoner_harvesting_name: "$wce_prisoner_program_harvesting$"
 wce_prisoner_donation_name: "$wce_prisoner_program_donation$"
 wce_prisoner_sanctuary_name: "$wce_prisoner_program_sanctuary$"
 wce_prisoner_program_standard: "Содержание Под Стражей"
 wce_prisoner_program_standard_name: \"$wce_prisoner_program_standard$"
 wce_prisoner_program_standard_desc: "Военнопленные содержатся под стражей ровно до тех самых пор, пока мы не примем решение об их дальнейшей судьбе."
 wce_prisoner_program_harvesting: "Извлечение Органов"
 wce_prisoner_program_harvesting_name: "$wce_prisoner_program_harvesting$"
 wce_prisoner_program_harvesting_desc: "Военнопленных разбирают на составляющие.\n- Во время работы программы, каждый военнопленный предоставляет §G0.5§! $urp_213$\n- Галактическое Содружество ежемесячно повышает §H$urp_211$§! нашего государства на §R+1§! единицу.\n- Мнение их родных государств: §R-80§!\n- §RНарушается следующая резолюция: $resolution_wce_treatment_of_the_captured$§!"
 wce_prisoner_program_donation: "Добровольное Сотрудничество"
 wce_prisoner_program_donation_name: "$wce_prisoner_program_donation$"
 wce_prisoner_program_donation_desc: "Военнопленные могут предоставить собственные образцы тканей, антител и генетические маркеры в обмен на своё досрочное освобождение.\n- Во время работы программы, каждый военнопленный предоставляет §G0.5§! $urp_214$\n- Мнение их родных государств: §R-20§!"
 wce_prisoner_program_sanctuary: "Исправительные Святилища"
 wce_prisoner_program_sanctuary_name: "$wce_prisoner_program_sanctuary$"
 wce_prisoner_program_sanctuary_desc: "Тюрьмы массово превращаются в святилища, в которых военнопленные размышляют о смысле своего существования, искупают свою вину перед победителем и отдают всего себя общественным работам прежде чем заслужить освобождение.\n- Во время работы программы, каждый военнопленный предоставляет §G0.4§! $urp_214$\n- Мнение их родных государств: §R-20§!"

 edict_wce_transplant_program: "Программы Трансплантации"
 edict_wce_transplant_program_desc: "Благодаря максимально быстрой и довольно доступной, благодаря этой программе, трансплантации органов, наши лидеры имеют возможность щанимать свои должности гораздо дольше, чем могли ранее. §Y10§! лет не такой уж и малый срок."
 edict_wce_organ_bank: "Банки Органов"
 edict_wce_organ_bank_desc: "Благодаря доступности качественных органов более нет граждан, находящихся в очереди на их трансплантацию. Срок действия программы — §Y10§! стандартных лет."
 edict_wce_gene_therapy: "Клиники Генной Терапии"
 edict_wce_gene_therapy_desc: "Благодаря предоставленным генетическим маркерам мы в состоянии частично подавлять многие возрастные болезни. Срок действия программы — §Y10§! стандартных лет."
 edict_wce_public_health: "Инициативы Общественного Здравоохранения"
 edict_wce_public_health_desc: "Вакцины, созданные на основе пожертвованных образцов инопланетных тканей, уникальных антител и генетических маркеров - произвели в обществе настоящий фурор. Срок действия программы — §Y10§! стандартных лет."

 wce_opinion_organs_harvested: "Извлекали органы наших граждан"
 wce_opinion_donor_program: "Использовали наших граждан в качестве доноров"

 # infamy
 wce_infamy_notorious: "Постыдный"
 wce_infamy_notorious_desc: "Известия о преступлениях наших граждан, совершённых в процессе военного конфликта, разносятся по всей галактике.\n\nДостигается при уровне §H$urp_211$§! превышающем §Y25§! единиц. Возрастает при проведении жестоких бомбардировок, остеклении колоний, чистках и жестоком обращении с заключёнными. В мирное время постепенно снижается. На §G0.25§! ежемесячно."
 wce_infamy_infamous: "Бесчестный"
 wce_infamy_infamous_desc: "По всей нашей вселенной, наименование нашего вида произносится с ужасом. \n\nДостигается при уровне §H$urp_211$§! превышающем §H50§! единиц. На этом уровне другие галактические государства получают против нас законный §Y$casus_belli_cb_wce_crimes_against_the_galaxy$§! §H«Casus Belli»§!."
 wce_infamy_pariah: "Отверженный"
 wce_infamy_pariah_desc: "Наша репутация настолько испорчена, что ни одно цивилизованное космическое государство не станет вести с нами какие-либо переговоры. \n\nДостигается при уровне §H$urp_211$§! превышающем §R75§! единиц. Те же, из государсв, которые подчиняются нам - делают это из скорее из страха чем из почтения."

 wce_opinion_notorious: "Постыдное Поведение"
 wce_opinion_infamous: "Бесчестное Поведение"
 wce_opinion_pariah: "Галактический Отверженный"
 wce_opinion_convention_violator: "Нарушение Галактических Конвенций"
 wce_opinion_harbors_war_criminals: "Укрытие Военных Преступников"
 wce_opinion_executed_prisoners: "Массовые Казни Наших Военнопленных"
 wce_opinion_pows_returned: "Массовое Освобождение Военнопленных"

 # leaders
 leader_trait_wce_war_criminal: "Военный Преступник"
 leader_trait_wce_war_criminal_desc: "Это должностное лицо подписывало преступные приказы. Согласно галактической резолюции:  §Y$resolution_wce_the_tribunal$§!, иностранные государства, одержавшие над нами победу, могут потребовать их экстрадиции для последующего военного трибунала на условиях победителя."
 wce_harbors_war_criminals: "Укрытие Военных Преступников"

 # galactic conventions
 resolution_category_wce_conventions: "Галактические Конвенции"
 resolution_category_wce_conventions_desc: "Обязательные к исполнению правила ведения межзвездной войны."

 resolution_wce_protected_worlds: "Конвенция I: Защищенные Миры"
 resolution_wce_protected_worlds_desc: "Обитаемые миры не должны рассматриваться в качестве военных целей. Наземные вторжения регламентированы при условии сохранения культурного наследия первоначального владельца инфраструктуры."
 resolution_wce_protected_worlds_tooltip: "Государства, подписавшие конвенцию и осуществляющие бомбардировки следующих видов: §Y«Без разбора»§! или §Y«Армагеддон»§!, либо уничтожающие колонию прямиком с орбиты, будут считаться §Rнарушителями§! на срок §Y5§! стандартных лет со всеми последствиями и в дополнение к вышеуказанному получают §H$urp_211$§!."

 resolution_wce_treatment_of_the_captured: "Конвенция II: Обращение С Пленными"
 resolution_wce_treatment_of_the_captured_desc: "Экипажу боевого судна, принявшему решение о капитуляции, следует сохранить не только жизнь, но и достоинство."
 resolution_wce_treatment_of_the_captured_tooltip: "Государства, подписавшие конвенцию, которые примут решение §Yказнить§!, §Yобращать в рабство§! либо проводить любой вид §Yгеноцида§! военнопленных, будут считаться §Rнарушителями§! на срок §Y5§! стандартных лет со всеми последствиями и в дополнение к вышеуказанному получают §H$urp_211$§!."

 resolution_wce_the_tribunal: "Конвенция III: Военный Трибунал"
 resolution_wce_the_tribunal_desc: "Те, кто отдаёт приказы о совершении военных преступлений, обязательно должны понести ответственность перед Галактическим Трибуналом, исключений быть не может и не должно."
 resolution_wce_the_tribunal_tooltip: "Когда война заканчивается, государство-победитель может потребовать от проигравшей стороны выдать ему всех ответственных должностных лиц, с чертой §Y$leader_trait_wce_war_criminal$§! Отказ проигравшей стороны приводит к тому, что на побеждённое государство накладываются §Rвторичные санкции§! на срок §Y10§! стандартных лет, а так-же официально оформляется новый  §Y$casus_belli_cb_wce_crimes_against_the_galaxy$§! §H«Casus Belli»§!."

 resolution_wce_repeal_1: "§RОтмена $resolution_wce_protected_worlds$§!"
 resolution_wce_repeal_1_desc: "Война — это настоящий ад. Если притворяться, что это не так - это лишь сковывает в действиях тех, кто готов нас защищать и ставит на это свою жизнь."
 resolution_wce_repeal_1_effect_success: "Отмена §Y$resolution_wce_protected_worlds$§!."
 resolution_wce_repeal_2: "§RОтмена $resolution_wce_treatment_of_the_captured$§!"
 resolution_wce_repeal_2_desc: "$resolution_wce_repeal_1_desc$"
 resolution_wce_repeal_2_effect_success: "Отмена §Y$resolution_wce_treatment_of_the_captured$§!, в действие вступает следующая резолюция:  §Y$resolution_wce_protected_worlds$§!."
 resolution_wce_repeal_3: "§RОтмена $resolution_wce_the_tribunal$§!"
 resolution_wce_repeal_3_desc: "$resolution_wce_repeal_1_desc$"
 resolution_wce_repeal_3_effect_success: "Отмена §Y$resolution_wce_the_tribunal$§!, в действие вступает следующая резолюция: §Y$resolution_wce_treatment_of_the_captured$§!."

 # casus belli and war goal
 casus_belli_cb_wce_crimes_against_the_galaxy: "Преступления Против Галактики"
 casus_belli_cb_wce_crimes_against_the_galaxy_acquire_hint: "§EСтановится доступно в отношении тех государств, §H$urp_211$§! которых превышает значение в §H50§! единиц, или же тех, которые отказались выдавать укрываемых военных преступников. Но §H«Casus Belli»§! будет недоступен в том случае, если мы сами имеем §H«дурную славу»§!.§!"
 casus_belli_cb_wce_regime_notorious: "Постыдная Репутация ($urp_211$ §H25-49§!)"
 casus_belli_cb_wce_regime_infamous: "Бесчестный Репутация ($urp_211$ §H50-74§!)"
 casus_belli_cb_wce_regime_pariah: "Репутация Отверженных ($urp_211$ §H75+§!)"
 war_goal_wg_wce_bring_to_justice: "Призвать к Ответу"
 war_goal_wg_wce_bring_to_justice_desc: "Эта война ведётся с целью положить конец военным преступлениям вражеского режима и привлечь всех виновных к ответственности."
 wg_wce_bring_to_justice_accept: "Государство §Y[From.GetName]§!, уровень §H$urp_211$§! : §H[From.wce_infamy_shown]§!.\nДля начала §Y[From.GetName]§! должно покаяться и начать выплачивать §Y$wce_war_reparations$§! и выплачивать их в течении §Y10§! стандартных лет, после чего передать всех должностных лиц, обладающих чертой §Y$leader_trait_wce_war_criminal$§! под трибунал.\nГалактическое Содружество на §G25§! единиц понизит §H$urp_211$§! государства §Y[From.GetName]§!.\n§Y[Root.GetName]§! получает §G+150§! £influence£"

 wce_war_reparations: "Военные Репарации"
 wce_war_reparations_desc: "Мы несём полную ответственность за военные преступления нашего прежнего режима и выплачиваем за них компенсацию в виде репараций."
 wce_heroes_of_the_nation: "Герои Нации"
 wce_heroes_of_the_nation_desc: "Мы решили сделать героями всех тех лидеров и управителей, которых галактика решила обвинить в военных преступлениях."

 # prisoners of war
 wce_decision_pow_repatriate: "Репатриация Военнопленных"
 wce_decision_pow_repatriate_desc: "Возвращение всех, захваченных во время межзвёздных конфликтов, военнопленных на родину."
 wce_decision_pow_repatriate_effects: "Все заключенные освобождены из плена.\nКаждое государство, военнопленных которого мы удерживали, получает §G+40§! одобрения и §G+20§! доверия по отношению к нам в результате этого действия.\nВ случае принятия этого решения, Галактическое Содружество на §G5§! единиц понизит §H$urp_211$§! нашего государства."

 wce_decision_pow_interrogate: "Допрос Военнопленных"
 wce_decision_pow_interrogate_desc: "Пленные офицеры должны обладать ценной, в военном смысле, информацией."
 wce_decision_pow_interrogate_effects: "Получить §G+20§! разведданных о всех инопланетных государствах, представителей которых мы содержим в качестве военнопленных.\nАвторитарные режимы правления применяют более жесткие методы допроса: в случае принятия этого решения, Галактическое Содружество на §R+1§! единицу повысит §H$urp_211$§! нашего государства.\nПри этом военнопленные продолжат удерживаться в плену."
 wce_interrogated_recently_tt: "В течение последнего года мы систематически допрашивали наших военнопленных."

 wce_decision_pow_indoctrinate: "Перевоспитание Военнопленных"
 wce_decision_pow_indoctrinate_desc: "Пройдя полный цикл перевоспитания, который занимает примерно один календаный год, они несомненно поймут, почему оказались не по ту сторону баррикад."
 wce_decision_pow_indoctrinate_effects: "Все новоприбывшие формируют новые £pop£ §Yдолжности§! в этом мире из числа военнопленных. Чем больше военнопленных, тем больше новых £pop£ §Yдолжностей§!.\nВ случае пребывания у власти в нашем государстве правительства с любого рода §R«Авторитарной Формой Правления»§!, Галактическое Содружество на §R+3§! единицы повысит §H$urp_211$§! нашего государства."

 wce_decision_pow_forced_labor: "Трудовые Лагеря Военнопленных"
 wce_decision_pow_forced_labor_desc: "Основная задача данного инфраструктурного комплекса — трудоустройство военнопленных на литейные заводы для работы на благо нашего государства."
 wce_decision_pow_forced_labor_effects: "На следующие §Y10§! стандартных лет формируются новые §Y$wce_pow_forced_labor$§!.\nВ случае принятия этого решения, Галактическое Содружество на §R+8§! единиц повысит §H$urp_211$§! нашего государства.\n§RНарушает резолюцию $resolution_wce_treatment_of_the_captured$§!, если она является действующей."
 wce_needs_50_pows_tt: "Требуется не менее §Y50§! заключенных."
 wce_needs_100_pows_tt: "Требуется не менее §Y100§! заключенных."
 wce_pow_forced_labor: "Лагеря Военнопленных"
 wce_pow_forced_labor_desc: "Военнопленные противника трудятся в наших производственных лагерях."

 wce_decision_pow_execute: "Казнить Военнопленных"
 wce_decision_pow_execute_desc: "О пощаде они не просили, и пощады они им давали."
 wce_decision_pow_execute_effects: "Все заключенные были казнены.\nНа следующие §Y10§! стандартных лет государство принимает §Y$wce_terror_doctrine$§!.\nКаждое государство, военнопленных которого мы удерживали: ухудшает мнение о нашем государстве на §R-100§!.\nПредставитель нашего государства получает черту §Y$leader_trait_wce_war_criminal$§!.\nВ случае принятия этого решения, Галактическое Содружество на §R+15§! единиц повысит §H$urp_211$§! нашего государства.\n§RНарушает резолюцию $resolution_wce_treatment_of_the_captured$§!, если она является действующей."
 wce_terror_doctrine: "Доктрины Террора"
 wce_terror_doctrine_desc: "Вражеские солдаты знают, что их ждет в плену, если они вдруг капитулируют, и это их удручает."

 wce.21.name: "Военнопленные"
 wce.21.desc: "Выжившие вражеские солдаты, спасённые из обломков вражеских кораблей, бойцы наземных формирований, вовремя сложившие своё оружие и шпионы, пойманные в тылу, в настоящее время пребывают под нашей юрисдикцией. Впервые за время текущего конфликта у нашего государства появились пленники из состаава вражеской армии.\n\nТо, как мы с ними теперь обойдёмся, останется в памяти многих..."
 wce.21.a: "Пока что оставим их в плену."
 wce.21.a.tt: "Уничтожение вражеских кораблей и разгром вражеских армий теперь с определенной вероятностью предоставляет §Yвоеннопленных§! Решить их дальнейшую судьбу мы можем воспользовавшись §YРешением§! в столице нашего государства или же специальной политикой: §Y$policy_wce_prisoner_program$§!."

 # the tribunal
 wce.30.name: "Созыв Военного Трибунала"
 wce.30.desc: "В соответствии с резолюцией:  §H$resolution_wce_the_tribunal$§!, Государство §Y[From.GetName]§! выдвигает обвинения против наших офицеров, причастных к военным преступлениям во времена предыдущей военной кампании, объявляет из в галактический розыск и требует, чтобы наши органы правопорядка выдали их для проведения военного трибунала.\n\nВся галактика ожидает нашего решения."
 wce.30.a: "Военных Преступников Под Трибунал!"
 wce.30.a.tt: "Каждое должностное лицо, облажающее чертой §Y$leader_trait_wce_war_criminal$§!, предстанет перед коллегией §Y«Военного Трибунала»§!. Каждый из них будет либо §Rказнен§!, либо §Gоправдан§!, а результирующий приговор будет зависеть от того, насколько беспристрастными будут судьи коллегии.\nВ результате этого выбора, Галактическое Содружество на §G10§! единиц понизит §H$urp_211$§! нашего государства."
 wce.30.b: "Наше государство не признаёт легитимность этого суда."
 wce.30.b.tt: "В результате этого выбора, Галактическое Содружество на §R+15§! единиц повысит §H$urp_211$§! нашего государства.\nКаждый член Галактического Сообщества: ухудшает мнение о нашем государстве на §R-60§!.\nНа даный момент мы уже  §Rнарушаем резолюцию§!: §Y$resolution_wce_the_tribunal$§! на следующие §Y10§! стандартных лет и получаем §H«Casus Belli»§!: §Y$casus_belli_cb_wce_crimes_against_the_galaxy$§!."
 wce.30.c: "Они честно выполняли свой долг. Обязательно наградите их всех!"
 wce.30.c.tt: "$wce.30.b.tt$\nВ результате этого выбора, Галактическое Содружество на §R+10§! единиц повысит §H$urp_211$§! нашего государства.\nОбвиняемые в военных преступлениях получат пл §G+200§! очков опыта каждый.\nВ добавок ко всему, они получат звание §Y$wce_heroes_of_the_nation$§! на следующие §Y10§! стандартных лет."

 wce.31.name: "Экстрадиция Одобрена"
 wce.31.desc: "Государство §Y[From.GetName]§! под конвоем экстрадирует своих военных преступников на заседание §Y«Военного Трибунала»§!. Их судебные разбирательства были краткими но ёмкими. Одни были приговоренны к поовешению, другие же вышли на свободу.\n\nСправедливость, так или иначе, восторжествовала."
 wce.31.a: "Вот и конец."

 wce.32.name: "В экстрадиции отказано"
 wce.32.desc: "Государство §Y[From.GetName]§! отказывается выдавать своих военных преступников, признавая трибунал инструментом правосудия победителей, а все задействованные должностные лица сохраняют свои регалии и звания."
 wce.32.a: "Это ещё не конец."
 wce.32.a.tt: "В результате этого выбора, мы можем объявить войну государству §Y[From.GetName]§! на основании §H«Casus Belli»§! : §Y$casus_belli_cb_wce_crimes_against_the_galaxy$§!."

 # scorched earth
 policy_wce_scorched_earth: "Выжженная Земля"
 policy_wce_scorched_earth_desc: "Неужели наши миры могут быть превращены в руины, лишь бы не достались при этом захватчику?"
 wce_scorched_earth_forbidden_name: "$wce_scorched_earth_forbidden$"
 wce_scorched_earth_forbidden: "Запрещено"
 wce_scorched_earth_forbidden_desc: "Наши миры не должны быть уничтожены нашими же стараниями."
 wce_scorched_earth_permitted_name: "$wce_scorched_earth_permitted$"
 wce_scorched_earth_permitted: "Разрешено"
 wce_scorched_earth_permitted_desc: "Лучше сжечь всё до тла и развеять пепел, чем сделать столь большой подарок нашему врагу. Разблокирует решение: §Y$wce_decision_scorched_earth$§! на мирах, находящихся под угрозой оккупации."

 wce_decision_scorched_earth: "Выжженная Земля"
 wce_decision_scorched_earth_desc: "Уничтожьте всё ценное, присущее этому миру, пока захватчик ещё не успел это захватить силой."
 wce_decision_self_terminate: "Протоколы Самоуничтожения"
 wce_decision_self_terminate_desc: "Отдайте приказ на самоуничтожение всем объектам этого мира. Они не должны попасть под контроль врага."
 wce_decision_scorched_earth_effects: "§RУничтожает все постройки§! этого мира.\nУвеличивает разрушение на §R+50§!.\n§R20%§! населения спасается бегством или гибнет.\nМир превращается в §Y$wce_scorched_earth_blight$§! на следующие §Y20§! стандартных лет.\nГосударства, не управляемые посредством Гештальт Сознания, получают §Y$wce_scorched_earth_resentment$§!на следующие §Y10§! стандартных лет.\nВ результате этого решения, Галактическое Содружество на §R+5§! единиц повысит §H$urp_211$§! нашего государства."
 wce_planet_not_under_threat_tt: "На этот мир, должно осуществляться §Yвторжение§! или он должен подвергаться  §Yбомбаадировке§!. Но как только этот мир падет - будет уже слишком поздно."

 wce_scorched_earth_blight: "Выжженный Мир"
 wce_scorched_earth_blight_desc: "Этот мир был разрушен до основания его же защитниками. На восстановление критической ифраструктуры уйдет целое поколение, а то и не одно."
 wce_scorched_earth_resentment: "Сгоревшие Дома"
 wce_scorched_earth_resentment_desc: "Наши граждане никоогда не забудут и не простят тот факт, что их собственное правительство вероломно сожгло их родные дома."

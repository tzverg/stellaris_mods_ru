l_russian:


  leader_trait_nltr_electro_scientist: "Учёный-Астроэнергетик"
  leader_trait_nltr_electro_scientist_desc: "Этот учёный проявляет большой интерес к изучению и разработке способов выработки и аккумуляции £energy£ §Yэлектроэнергии§!."
  leader_trait_nltr_hyperfocus_physics: "Учёный-Астрофизик"
  leader_trait_nltr_hyperfocus_physics_desc: "Этот учёный уделяет большое внимание исследованиям в области £physics£ §Bфизики§! в ущерб другим научным дисциплинам."
  leader_trait_nltr_hyperfocus_society: "Учёный-Астросоциолог"
  leader_trait_nltr_hyperfocus_society_desc: "Этот учёный уделяет большое внимание исследованиям в области £society£ §cсоциологии§! в ущерб другим областям науки."
  leader_trait_nltr_hyperfocus_engineering: "Учёный-Астроинженер"
  leader_trait_nltr_hyperfocus_engineering_desc: "Этот учёный уделяет большое внимание исследованиям в области £engineering£ §Sинженерии§! в ущерб другим областям науки."
  leader_trait_nltr_scientific_union: "Учёный-Астроинтегратор"
  leader_trait_nltr_scientific_union_desc: "Этот учёный всей душой верит в £unity£ §Eединство§! нашего народа, которое достигается благодаря различного рода исследованиям и научным достижениям."
  leader_trait_nltr_shroud_developer: "Учёный-Астроваятель"
  leader_trait_nltr_shroud_developer_desc: "Этот мудрец направляет §Mэнергию покрова§!, усиленную псионическим присутствием нашей общины, на ускорение постройки инфраструктурных проектов."
  leader_trait_nltr_genetic_algorithmist: "Учёный-Астрогенетик"
  leader_trait_nltr_genetic_algorithmist_desc: "Этот учёный — настоящий мастер в области генетического проектирования и сиквенирования, что значительно способствует развитию науки, смежной с клонированием и биологическими манипуляциями."

  leader_trait_kinetic_weapon_specialist: "Командир-Баллистик"
  leader_trait_kinetic_weapon_specialist_desc: "Этот командир является экспертом в области применения кинетического вооружения."



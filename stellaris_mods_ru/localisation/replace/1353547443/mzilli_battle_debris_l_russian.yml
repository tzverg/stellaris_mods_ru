sm_mzilli_battle_debris_recycling_center: "Зона Утилизации"
sm_mzilli_battle_debris_recycling_center_desc: "Эту систему захламляет множество обломков звездолетов различных форм и конструкций. Обломки слишком сильно повреждены, для того чтобы из них можно было извлечь что-либо ценное, но грамотно организованный процесс утилизации способен предоставить ценные материалы."

sm_mzilli_battle_debris_memorial: "Военный Мемориал"
sm_mzilli_battle_debris_memorial_desc: "За эту звёздную систему было пролито немало крови. Было бы подлостью предать забвению жертвы падших."

requires_mzilli_battle_debris: "В этой звёздной системе должны находиться относительно свежие обломки, оставшиеся вследствие боевого столкновения двух космических держав."